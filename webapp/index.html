<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meesho Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://api.qrserver.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --m:#F43397;--m-d:#D91E7A;--m-dd:#B01560;
  --m-bg:rgba(244,51,151,.09);--m-bg2:rgba(244,51,151,.16);
  --grad:linear-gradient(135deg,#F94BA8 0%,#C21876 100%);--grad-glow:rgba(176,21,96,.32);
  --white:#FFFFFF;--surface:#FFFFFF;--surface2:#F8FAFC;--bg:#F5F6F8;
  --text:#0F172A;--text2:#64748B;--text3:#94A3B8;--text4:#CBD5E1;
  --border:rgba(15,23,42,.07);--border2:rgba(15,23,42,.13);
  --red:#DC2626;--red-bg:rgba(220,38,38,.08);
  --orange:#D97706;--orange-bg:rgba(217,119,6,.09);
  --green:#16A34A;--green-bg:rgba(22,163,74,.09);
  --radius:16px;--radius-sm:12px;--radius-xs:9px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 1px 4px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow:0 2px 8px rgba(0,0,0,.06),0 8px 32px rgba(0,0,0,.07);
  --shadow-lg:0 8px 24px rgba(0,0,0,.10),0 16px 48px rgba(0,0,0,.10);
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;max-width:480px;margin:0 auto;background:var(--bg)}
/* Safety net: a bare inline SVG never balloons to full width */
svg{max-width:100%;max-height:100%}
.card-title>svg{width:18px;height:18px;stroke:var(--m-d);fill:none;stroke-width:2;flex-shrink:0}

/* Header */
#header{background:var(--grad);padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 2px 16px rgba(176,21,96,.35)}
#hdr-icon{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#hdr-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hdr-text{line-height:1.25;flex:1;min-width:0}
#hdr-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr-sub{font-size:10px;color:rgba(255,255,255,.72);font-weight:600;letter-spacing:.7px;text-transform:uppercase;margin-top:2px;white-space:nowrap}
#hdr-chip{background:rgba(255,255,255,.92);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:800;color:var(--m-d);display:flex;align-items:center;gap:5px;flex-shrink:0;letter-spacing:-.3px}
#hdr-chip svg{width:13px;height:13px;stroke:var(--m-d);fill:none;stroke-width:2.4}

/* Pages */
#pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.page{display:none;padding:14px 0 40px;animation:fade .28s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin:0 16px 10px}
.card-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;letter-spacing:-.2px;margin-bottom:14px}
.card-title .ct-ic{width:32px;height:32px;border-radius:9px;background:var(--m-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-title .ct-ic svg{width:16px;height:16px;stroke:var(--m-d);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card-title .ct-sub{font-size:11px;font-weight:600;color:var(--text3);margin-left:auto;letter-spacing:0}

/* Section title (page-level) */
.sec-title{padding:2px 16px 12px;font-size:20px;font-weight:800;letter-spacing:-.4px}
.acc-sec-hd{display:flex;align-items:baseline;justify-content:space-between;padding:18px 16px 10px}
.acc-sec-t{font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--text1)}
.acc-sec-c{font-size:12px;font-weight:600;color:var(--text3)}
/* Account search + filter bar (shown only for large wallets) */
.acc-tools{padding:0 16px 8px}
.acc-srch{position:relative;margin-bottom:9px}
.acc-srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2.2}
.acc-srch input{width:100%;padding:10px 34px 10px 33px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font-size:13.5px;background:#fff;color:var(--text1);box-sizing:border-box}
.acc-srch .acc-srch-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--text3);cursor:pointer;font-size:17px;line-height:1}
.acc-filters{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.acc-filters::-webkit-scrollbar{display:none}
.acc-chip{flex:0 0 auto;padding:6px 12px;border-radius:100px;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.acc-chip.sel{background:var(--m);border-color:var(--m);color:#fff}
/* full-page order detail */
.od-hd{display:flex;align-items:center;gap:12px;padding:16px 16px 6px}
.od-back{width:38px;height:38px;border-radius:11px;background:var(--surface2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s}
.od-back:active{background:var(--m-bg)}
.od-back svg{width:20px;height:20px;stroke:var(--text1)}
.od-title{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.2px}
.od-body{padding:8px 16px 28px}
.od-body .card{margin:0 0 12px;border-radius:16px}
/* hero product card */
.od-hero{display:flex;gap:13px;align-items:center;padding:14px;background:linear-gradient(135deg,var(--m-bg) 0%,#fff 90%);border:1.5px solid var(--m-bg2)}
.od-hero-img{width:64px;height:64px;border-radius:13px;object-fit:cover;flex-shrink:0;background:#F1F5F9}
.od-hero-nm{font-weight:800;font-size:14.5px;line-height:1.3;color:var(--text1);display:-webkit-box;display:box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.od-hero-sub{font-size:12px;color:var(--text2);font-weight:600;margin-top:4px}
/* status banner */
.od-status{display:flex;align-items:center;gap:10px;padding:13px 15px}
.od-status-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.od-status-ic svg{width:19px;height:19px}
.od-status-tx{flex:1;min-width:0}
.od-status-t{font-size:14px;font-weight:800;color:var(--text1)}
.od-status-s{font-size:12px;color:var(--text2);font-weight:500;margin-top:2px}
/* action buttons area */
.od-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.sec-title span{display:block;font-size:11.5px;font-weight:600;color:var(--text3);letter-spacing:.2px;margin-top:2px}


/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;width:100%;border:none;cursor:pointer;transition:transform .12s,background .15s;letter-spacing:-.1px;font-family:inherit}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.98)}
.btn-m{background:var(--m);color:#fff;box-shadow:0 2px 8px rgba(217,30,122,.22)}
.btn-m:active{background:var(--m-d)}
.btn-outline{background:#fff;color:var(--m-d);border:1.5px solid var(--m)}
.btn-outline:active{background:var(--m-bg)}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1.5px solid #E2E8F0}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(220,38,38,.2)}
.btn-sm{height:36px;width:auto;padding:0 16px;border-radius:9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn+.btn{margin-top:9px}
.btn.loading{color:transparent!important;pointer-events:none;position:relative}
.btn.loading::after{content:"";position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.btn-outline.loading::after,.btn-ghost.loading::after{border-color:var(--m-bg2);border-top-color:var(--m)}
.btn-row{display:flex;gap:9px}.btn-row .btn{margin-top:0}

/* Inputs */
.flbl{display:block;font-size:10.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px 2px}
.scanwrap.open{max-height:2000px !important}
.tier-row{display:flex;gap:6px}
.tier-opt{flex:1;text-align:center;background:#fff;border:1.5px solid #E2E8F0;border-radius:var(--radius-xs);padding:11px 4px;font-size:13.5px;font-weight:800;color:var(--text2);cursor:pointer;transition:all .15s;user-select:none}
.tier-opt .ts{display:block;font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.tier-opt.sel{border-color:var(--m-d);background:var(--m-bg);color:var(--m-d)}
.tier-opt.sel .ts{color:var(--m-d)}
.inp{width:100%;background:#fff;border:1.5px solid #E2E8F0;border-radius:var(--radius-xs);padding:12px 14px;font-size:14px;font-weight:600;color:var(--text);font-family:inherit;transition:border .15s,box-shadow .15s,background .15s;outline:none}
.inp::placeholder{color:var(--text3);opacity:.75}
.inp.otp{text-align:center;font-size:22px;letter-spacing:8px;font-weight:800;padding-left:22px}
.inp.otp::placeholder{letter-spacing:normal;font-size:14px;font-weight:500;padding:0}
.inp:focus{border-color:var(--m);background:#fff;box-shadow:0 0 0 3px var(--m-bg)}
/* keyboard/switch-access focus ring on interactive elements */
.btn:focus-visible,.acc-card:focus-visible,.pay-opt:focus-visible,.var-chip:focus-visible,.nav-btn:focus-visible,.acc-act:focus-visible,.acc-del:focus-visible,.qty-btn:focus-visible{outline:2px solid var(--m);outline-offset:2px}
/* stop the yellow/blue autofill repaint breaking the #fff input theme */
.inp:-webkit-autofill,.inp:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 40px #fff inset;box-shadow:0 0 0 40px #fff inset;-webkit-text-fill-color:var(--text)}
/* bigger tap targets (>=44px) on small controls without changing their visual size */
.cart-del,.qty-btn,.acc-act,.acc-del,.sheet-x{position:relative}
.cart-del::after,.qty-btn::after,.acc-act::after,.acc-del::after,.sheet-x::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px}
textarea.inp{min-height:70px;resize:none}
.field{margin-bottom:13px}
.frow{display:flex;gap:10px;margin-bottom:13px}.frow .field{flex:1;margin-bottom:0}
/* Per-field Random toggle (in the label row) */
.ad-lbl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ad-tg{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;margin:0 0 6px 0}
.ad-tg input{position:absolute;opacity:0;width:0;height:0}
.ad-sw{width:30px;height:17px;border-radius:100px;background:#CBD5E1;position:relative;transition:background .15s;flex-shrink:0}
.ad-sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.ad-tg input:checked + .ad-sw{background:var(--m)}
.ad-tg input:checked + .ad-sw::after{transform:translateX(13px)}
.ad-tt{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.ad-tg input:checked ~ .ad-tt{color:var(--m-d)}
.inp.ad-off,.inp:disabled{background:var(--surface2);color:var(--text3);cursor:not-allowed}

/* Pills / chips */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:-.1px}
/* Refer & Earn card (Address tab, under the address) */
/* Check-orders button in the Saved Accounts header */
.acc-sync{display:inline-flex;align-items:center;gap:5px;margin-left:auto;margin-right:10px;
  padding:5px 10px;border:1px solid var(--border);border-radius:100px;background:var(--surface);
  color:var(--m-d);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.acc-sync svg{width:13px;height:13px;stroke:var(--m-d);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 13px}
.acc-sync:disabled{opacity:.6}
/* NAME CLASH: `.spin` is already a 42px BORDER SPINNER (see below) — adding it
   to a button turned the whole button, text and all, into that spinner and
   rotated it. Use a scoped class so only the icon spins. */
.acc-sync.busy svg{animation:accspin .9s linear infinite}
@keyframes accspin{to{transform:rotate(360deg)}}
/* Orders tab switcher: this account | all orders */
.ord-tabs{display:flex;gap:6px;margin:0 16px 12px;background:var(--surface2);
  border:1px solid var(--border);border-radius:100px;padding:3px}
.ord-tab{flex:1;padding:7px 10px;border:0;border-radius:100px;background:transparent;
  color:var(--text3);font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:5px}
.ord-tab.on{background:var(--surface);color:var(--m-d);box-shadow:var(--shadow-xs)}
.ord-tab .ot-n{font-size:10.5px;font-weight:800;opacity:.7}
.ord-sync-row{display:flex;justify-content:flex-end;margin:0 16px 10px}
.ord-sync{margin-left:0;margin-right:0}
.acc-sub{font-size:10.5px;font-weight:600;color:var(--text3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-blue{background:#e8f0fe;color:#1a56db}
.rf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rf-stat.rej .rf-n{color:var(--red)}
.rf-stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.rf-stat .rf-n{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--text);line-height:1.15}
.rf-stat .rf-l{font-size:10.5px;font-weight:700;color:var(--text3);margin-top:2px;letter-spacing:0}
.rf-stat.ok .rf-n{color:var(--green)}
.rf-stat.pend .rf-n{color:var(--orange)}
/* The icon MUST be sized here. A bare svg() inside a flex row has no intrinsic
   size, so it stretched to fill the whole card (a full-width link glyph). */
.rf-link{display:flex;align-items:center;gap:8px;background:var(--m-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:10px}
.rf-link>svg{width:15px;height:15px;flex:0 0 15px;stroke:var(--m-d);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rf-link code{flex:1 1 auto;min-width:0;font-size:11px;font-weight:600;color:var(--m-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
.rf-row{display:flex;gap:8px;align-items:stretch}
.rf-row .btn{flex:1 1 0;min-width:0;margin:0}
.rf-note{font-size:11px;font-weight:600;color:var(--text3);line-height:1.5;margin-top:8px}
.rf-note b{color:var(--m-d)}
.rf-people{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.rf-ph{font-size:10.5px;font-weight:700;color:var(--text3);margin-bottom:4px}
.rf-p{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;font-weight:600}
.rf-p .rf-pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.pill-green{background:rgba(22,163,74,.14);color:var(--green)}
.pill-red{background:var(--red-bg);color:var(--red)}
.pill-orange{background:var(--orange-bg);color:var(--orange)}
.pill-gray{background:var(--surface2);color:var(--text2)}
.pill-m{background:var(--m-bg2);color:var(--m-d)}

/* Info rows */
.irow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border)}
.irow:last-child{border-bottom:none}
.irow .k{font-size:12.5px;color:var(--text2);font-weight:500}
.irow .v{font-size:13px;color:var(--text);font-weight:700;text-align:right}
.irow .v.disc{color:var(--green)}
.irow.total{border-top:1.5px solid var(--border);border-bottom:none;margin-top:4px;padding-top:11px}
.irow.total .k{font-weight:700;color:var(--text)}.irow.total .v{font-size:16px;font-weight:800}

/* ── Checkout: bill details ── */
.co-item{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border)}
.co-item:last-of-type{border-bottom:none}
.co-thumb{width:44px;height:44px;border-radius:10px;background:var(--surface2);overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.co-thumb img{width:100%;height:100%;object-fit:cover}
.co-thumb svg{width:20px;height:20px;stroke:var(--text3);fill:none;stroke-width:1.8}
.co-info{flex:1;min-width:0}
.co-name{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.co-meta{font-size:11px;color:var(--text2);font-weight:500;margin-top:2px}
.co-line{font-size:13px;font-weight:800;color:var(--text);flex-shrink:0}
.bill-sep{height:1px;background:var(--border);margin:10px 0 4px}

/* Empty state */
.empty{text-align:center;padding:44px 24px}
.empty .e-ic{width:66px;height:66px;border-radius:20px;background:var(--m-bg);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
.empty .e-ic svg{width:30px;height:30px;stroke:var(--m);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty h3{font-size:15px;font-weight:800;margin-bottom:5px;letter-spacing:-.2px}
.empty p{font-size:12.5px;color:var(--text2);line-height:1.5;max-width:250px;margin:0 auto}

/* Skeletons */
.sk{background:linear-gradient(90deg,#eef1f5 25%,#f6f8fb 50%,#eef1f5 75%);background-size:200% 100%;animation:shim 1.3s infinite;border-radius:8px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:12px;margin-bottom:9px}
.sk-card{height:74px;margin:0 16px 10px;border-radius:var(--radius)}
/* structured skeleton row: avatar + two text lines, matches the real card shape */
.sk-row{display:flex;align-items:center;gap:13px;padding:14px;margin:0 16px 10px;border:1.5px solid var(--border);border-radius:var(--radius);background:#fff}
.sk-av{width:46px;height:46px;border-radius:13px;flex-shrink:0}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:8px}
.sk-l1{height:13px;width:60%;border-radius:7px}
.sk-l2{height:10px;width:38%;border-radius:7px}

/* Bottom nav */
#nav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:max(4px,env(safe-area-inset-bottom));box-shadow:0 -2px 20px rgba(0,0,0,.04)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;background:none;border:none;cursor:pointer;position:relative;font-family:inherit}
.nav-btn svg{width:22px;height:22px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,transform .15s}
.nav-btn:active svg{transform:scale(.88)}
.nav-btn span{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:-.2px;transition:color .15s;white-space:nowrap;line-height:1}
.nav-btn.active svg{stroke:var(--m);transform:translateY(-1px)}
.nav-btn.active span{color:var(--m)}
.nav-badge{position:absolute;top:5px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px}

/* Account cards */
.acc-card{display:flex;align-items:center;gap:11px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;transition:border .15s,background .15s,box-shadow .15s;cursor:pointer;background:#fff;position:relative}
.acc-card:active{transform:scale(.98)}
.acc-card.sel{border-color:var(--m);background:var(--m-bg);box-shadow:0 4px 14px rgba(217,30,122,.12)}
.acc-av{width:40px;height:40px;border-radius:11px;background:var(--m-bg);color:var(--m-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;border:1.5px solid var(--m-bg2)}
/* Icons carry vertical-align:-2px for inline text; inside a flex-centered box
   that nudges them off-centre. Reset to block so they sit dead-centre. */
/* ico() hardcodes vertical-align:-2px for inline text; inside ANY flex/inline-flex
   icon box that nudges the glyph off-centre. Reset it for every centred icon box
   so icons sit dead-centre everywhere. Inline-in-text icons keep their -2px. */
.acc-av svg,.acc-act svg,.acc-del svg,.ct-ic svg,.e-ic svg,.pay-ic svg,.ord-ic svg,
.cart-thumb svg,.co-thumb svg,.qty-btn svg,.pill svg,.warn-ic svg,.cdlg-ic svg,
.cdlg-slot svg,.qr-status svg,.success-anim svg,#toast .t-ic svg,#hdr-chip svg,
#hdr-icon svg,.sheet-x svg,.prod-fod svg,.nav-btn svg{display:block}
.acc-card.used .acc-av{background:var(--green-bg);color:var(--green);border-color:rgba(22,163,74,.18)}
.acc-info{flex:1;min-width:0}
.acc-ph{font-size:14.5px;font-weight:800;letter-spacing:-.3px}
.acc-meta{font-size:11px;color:var(--text2);font-weight:500;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill-sel{background:var(--m);color:#fff}
.pill-sel svg{stroke:#fff}
/* Account card actions: a tight, uniform row of subtle icon buttons (copy /
   refresh / delete). Same size, same neutral resting style — colour only on tap. */
.acc-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.acc-act,.acc-del{width:34px;height:34px;border-radius:9px;background:var(--surface2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s;padding:0}
.acc-act svg,.acc-del svg{width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2;transition:stroke .15s}
.acc-act:active{background:var(--m-bg)}.acc-act:active svg{stroke:var(--m-d)}
.acc-del:active{background:var(--red-bg)}.acc-del:active svg{stroke:var(--red)}
/* Same `.spin` name clash as .acc-sync above: the global .spin is a 42px
   border spinner, so adding it to an icon button restyled the button
   itself. Scoped class, icon only. */
.acc-act.busy svg{animation:spin 0.8s linear infinite}
/* Export locked until an order is placed on the account (anti-siphon). Muted,
   still tappable so a tap can explain why. */
.acc-act-lock{opacity:.5}.acc-act-lock svg{stroke:var(--text3)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Inline warning / error cards (login) */
.warn-card{display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:var(--radius-sm);margin-bottom:12px;background:var(--orange-bg);border:1px solid rgba(217,119,6,.22)}
.bonus-ok,.bonus-no{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);margin:2px 0 12px;font-size:12.5px;font-weight:600;line-height:1.4}
.bonus-ok{background:var(--green-bg);color:var(--green)}
.bonus-no{background:var(--orange-bg);color:var(--orange)}
.bonus-ok svg,.bonus-no svg{flex-shrink:0;display:block}
.bonus-ok b,.bonus-no b{font-weight:800}
.warn-card.err{background:var(--red-bg);border-color:rgba(220,38,38,.2)}
.warn-card .warn-ic{width:40px;height:40px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.warn-card .warn-h{font-weight:800;font-size:13.5px;color:var(--orange);line-height:1.3}
.warn-card.err .warn-h{color:var(--red)}
.warn-card .warn-b{font-size:11.5px;color:var(--text2);font-weight:500;margin-top:2px;line-height:1.45}

/* Product card */
.prod{margin:0}
.prod-card{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);margin:0 16px 12px}
.prod-hero{position:relative;background:#fff;overflow:hidden;border-bottom:1px solid var(--border)}
.prod-imgs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.prod-imgs::-webkit-scrollbar{display:none}
.prod-imgs img{width:100%;height:210px;object-fit:contain;flex-shrink:0;scroll-snap-align:center;background:#fff;padding:6px}
.prod-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.prod-dots i{width:6px;height:6px;border-radius:50%;background:rgba(15,23,42,.18);transition:width .2s,background .2s}
.prod-dots i.on{background:var(--m);width:18px;border-radius:3px}
.prod-fod{position:absolute;top:10px;left:10px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:100px;box-shadow:0 2px 8px rgba(176,21,96,.4);display:flex;align-items:center;gap:4px}
.prod-body{padding:14px 16px 16px}
.prod-brand{font-size:10.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.prod-name{font-size:15px;font-weight:800;line-height:1.35;letter-spacing:-.2px;display:-webkit-box;display:box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-price{display:flex;align-items:baseline;gap:9px;margin-top:10px}
.prod-price .pp{font-size:21px;font-weight:800;letter-spacing:-.5px}
.prod-price .pm{font-size:14px;color:var(--text3);text-decoration:line-through;font-weight:600}
.prod-price .po{font-size:12.5px;color:var(--green);font-weight:800}
.co-struck{display:block;font-size:11px;color:var(--text3);text-decoration:line-through;font-weight:600;margin-top:2px}
.prod-upi{font-size:12px;color:var(--m-d);font-weight:600;margin-top:5px;display:flex;align-items:center;gap:5px}
.prod-meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--border)}
.prod-meta span{font-size:11.5px;color:var(--text2);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.prod-meta span.ok{color:var(--green)}.prod-meta span.no{color:var(--red)}
.mall-badge{background:#7C3AED;color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.5px}
.as-meta{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:5px;font-size:11px;color:var(--text2);font-weight:600;align-items:center}
.as-meta .ok{color:var(--green)}
.as-specs{margin:10px 4px 4px;display:flex;flex-direction:column;gap:5px}
.as-srow{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.as-srow span{color:var(--text3)}.as-srow b{font-weight:600;text-align:right}
.pd-sec{margin:14px 16px 0;padding-top:12px;border-top:1px solid var(--line)}
.pd-h{font-size:13px;font-weight:800;margin-bottom:8px}
.pd-specs{display:flex;flex-direction:column;gap:6px}
.pd-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.pd-row span{color:var(--text3)}.pd-row b{color:var(--text);font-weight:600;text-align:right}
.pd-desc{font-size:12.5px;color:var(--text2);line-height:1.55;white-space:pre-wrap}

/* Variation chips */
/* Cart rows — clean, simple list */
.cart-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.cart-row:last-of-type{border-bottom:none}
.cart-thumb{width:52px;height:52px;border-radius:12px;background:var(--surface2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text4)}
.cart-thumb img{width:100%;height:100%;object-fit:cover}
.cart-thumb svg{width:22px;height:22px;stroke:var(--text4);fill:none;stroke-width:1.8}
.cart-info{flex:1;min-width:0}
.cart-nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px;line-height:1.3}
.cart-mt{font-size:11.5px;color:var(--text3);font-weight:500;margin-top:3px}
.cart-price{font-size:14px;font-weight:800;color:var(--text);flex-shrink:0;letter-spacing:-.2px}
.cart-del{width:28px;height:28px;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s;margin-left:2px}
.cart-del:active{background:var(--red-bg)}
.qty-step{display:inline-flex;align-items:center;gap:0;margin-top:8px;border:1.5px solid var(--m-bg2);border-radius:9px;overflow:hidden;background:var(--m-bg)}
.qty-btn{width:30px;height:28px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
.qty-btn:active{background:var(--m-bg2)}
.qty-btn.dis{opacity:.35;pointer-events:none}
.qty-val{min-width:30px;text-align:center;font-size:13.5px;font-weight:800;color:var(--text);border-left:1.5px solid var(--m-bg2);border-right:1.5px solid var(--m-bg2);height:28px;line-height:28px}
.cart-total-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;margin-top:4px;border-top:1px dashed var(--border)}
.cart-total-bar .ctb-l{font-size:13px;font-weight:600;color:var(--text2)}
.cart-total-bar .ctb-r{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.4px}
.var-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:15px 0 9px}
.var-grid{display:flex;flex-wrap:wrap;gap:8px}
.var-chip{padding:9px 15px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;background:#fff;position:relative}
.var-chip.sel{border-color:var(--m);background:var(--m-bg);color:var(--m-d)}
.var-chip.oos{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.var-chip small{display:block;font-size:10px;font-weight:600;color:var(--text3);margin-top:1px}
.var-chip.sel small{color:var(--m-d)}

/* Pay options */
.pay-opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid #E2E8F0;border-radius:var(--radius-sm);margin-bottom:9px;cursor:pointer;transition:all .15s;background:#fff}
.pay-opt.sel{border-color:var(--m);background:var(--m-bg)}
.pay-opt.dis{opacity:.45;cursor:not-allowed}
.pay-ic{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pay-opt.sel .pay-ic{background:var(--m-bg2)}
.pay-ic svg{width:19px;height:19px;stroke:var(--text2);fill:none;stroke-width:2}
.pay-opt.sel .pay-ic svg{stroke:var(--m-d)}
.pay-txt{flex:1}.pay-txt .pt1{font-size:13.5px;font-weight:800}.pay-txt .pt2{font-size:11px;color:var(--text2);font-weight:500;margin-top:1px}
.pay-radio{width:20px;height:20px;border-radius:50%;border:2px solid #CBD5E1;flex-shrink:0;position:relative;transition:border .15s}
.pay-opt.sel .pay-radio{border-color:var(--m)}
.pay-opt.sel .pay-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--m)}

/* Order rows */
.ord-card{display:flex;align-items:center;gap:12px;padding:13px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow-xs);transition:transform .12s}
.ord-card:active{transform:scale(.98)}
.ord-ic{width:46px;height:46px;border-radius:11px;background:var(--m-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ord-ic svg{width:20px;height:20px;stroke:var(--m-d);fill:none;stroke-width:2}
.ord-ic img{width:100%;height:100%;object-fit:cover}
.ord-info{flex:1;min-width:0}
.ord-num{font-size:13px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord-meta{font-size:12px;color:var(--text2);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord-chev{color:var(--text3);flex-shrink:0}
.ord-chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Wallet hero */

/* Stat grid */

/* Accordion */
.acc-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);margin:0 16px 10px;overflow:hidden}
.acc-hd{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer;font-size:13px;font-weight:700}
.acc-hd .ah-ic{width:30px;height:30px;border-radius:8px;background:var(--m-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-hd .ah-ic svg{width:15px;height:15px;stroke:var(--m-d);fill:none;stroke-width:2}
.acc-hd .chev{margin-left:auto;transition:transform .2s}.acc-hd .chev svg{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2.5}
.acc-wrap.open .chev{transform:rotate(180deg)}
.acc-bd{display:none;padding:0 15px 15px;border-top:1px solid var(--border);padding-top:14px}
.acc-wrap.open .acc-bd{display:block}

/* Steps */
.steps{display:flex;gap:6px;margin-bottom:16px}
.step-dot{flex:1;height:4px;border-radius:2px;background:#E2E8F0;transition:background .3s}
.step-dot.on{background:var(--m)}

/* Loader */
#loader{position:fixed;inset:0;background:rgba(255,255,255,.78);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:900}
#loader.on{display:flex}
.spin{width:42px;height:42px;border:3.5px solid var(--m-bg2);border-top-color:var(--m);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Toast */
#toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;max-width:448px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);padding:13px 14px;display:none;align-items:center;gap:11px;z-index:1000;transform:translateY(-120%);transition:transform .3s cubic-bezier(.2,.8,.2,1);border:1px solid var(--border)}
#toast.show{display:flex;transform:none}
#toast .t-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#toast .t-ic svg{width:17px;height:17px;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
#toast .t-msg{flex:1;font-size:13px;font-weight:600;line-height:1.4}
#toast .t-bar{position:absolute;bottom:6px;left:14px;right:14px;height:2.5px;border-radius:2px}
#toast.err .t-ic{background:#FEE2E2}#toast.err .t-ic svg{stroke:#DC2626}#toast.err .t-bar{background:#DC2626}
#toast.suc .t-ic{background:#DCFCE7}#toast.suc .t-ic svg{stroke:#16A34A}#toast.suc .t-bar{background:#16A34A}
#toast.inf .t-ic{background:var(--m-bg)}#toast.inf .t-ic svg{stroke:var(--m-d)}#toast.inf .t-bar{background:var(--m)}

/* Modal / sheet */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.58);backdrop-filter:blur(6px);display:none;z-index:950;opacity:0;transition:opacity .25s}
.mask.show{display:block;opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;z-index:960;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.85,.25,1);padding:0 18px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.sheet.show{transform:none}
/* grip + header form ONE sticky top bar so the Order # title stays pinned while
   the content scrolls under it (no floating/duplicated header) */
.sheet-grip{flex-shrink:0;background:#fff;padding:8px 0 2px;margin:0 -18px;display:flex;justify-content:center;border-radius:24px 24px 0 0}
.sheet-grip::before{content:"";width:38px;height:4px;background:#E2E8F0;border-radius:2px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;background:#fff;padding:8px 0 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sheet-h .st{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sheet-x{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet-x svg{width:16px;height:16px;stroke:var(--text2);fill:none;stroke-width:2.4}

/* Premium confirm dialog (centered) */
#cmask{position:fixed;inset:0;background:rgba(15,23,42,.58);backdrop-filter:blur(6px);display:none;z-index:980;opacity:0;transition:opacity .2s;align-items:center;justify-content:center;padding:24px}
#cmask.show{display:flex;opacity:1}
.cdlg{width:100%;max-width:340px;background:#fff;border-radius:22px;padding:24px 22px 20px;box-shadow:0 24px 60px rgba(15,23,42,.28);transform:scale(.9);transition:transform .25s cubic-bezier(.2,.85,.25,1);text-align:center}
#cmask.show .cdlg{transform:scale(1)}
.cdlg-ic{width:58px;height:58px;border-radius:17px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:var(--m-bg)}
.cdlg-ic svg{width:28px;height:28px;stroke:var(--m-d);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cdlg-ic.danger{background:var(--red-bg)}.cdlg-ic.danger svg{stroke:var(--red)}
.cdlg-h{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.cdlg-b{font-size:13px;color:var(--text2);font-weight:500;line-height:1.5;margin-top:6px}
.cdlg-slot{display:inline-flex;align-items:center;gap:5px;margin-top:12px;padding:6px 13px;border-radius:100px;background:var(--m-bg);color:var(--m-d);font-size:12px;font-weight:800}
.cdlg-slot svg{width:14px;height:14px;stroke:var(--m-d);fill:none;stroke-width:2}
.cdlg-btns{display:flex;gap:10px;margin-top:20px}
.cdlg-btns .btn{margin:0}
.cbtn-cancel{background:var(--surface2);color:var(--text2);border:1.5px solid #E2E8F0}

/* QR modal */
.qr-wrap{text-align:center;padding:6px 0 4px}
.qr-amt{font-size:26px;font-weight:900;color:var(--m-d);letter-spacing:-.6px}
.qr-vpa{font-size:11.5px;color:var(--text2);font-weight:600;margin:3px 0 14px}
.qr-img{width:210px;height:210px;border:2px dashed var(--m-bg2);border-radius:16px;padding:8px;margin:0 auto 14px;background:#fff}
.qr-img img{width:100%;height:100%;border-radius:9px}
.qr-status{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;font-size:12px;font-weight:700;margin-bottom:14px}
.qr-status.wait{background:#FEF3C7;color:#B45309}
.qr-status.ok{background:#DCFCE7;color:#16A34A}
.qr-status.no{background:#FEE2E2;color:#DC2626}

/* Success screen */
.success-anim{width:88px;height:88px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;margin:8px auto 16px;animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.success-anim svg{width:44px;height:44px;stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* Timeline */
.tl{position:relative;padding-left:26px;margin-top:6px}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid #E2E8F0;z-index:2}
.tl-item.done .tl-dot{border-color:var(--green);background:var(--green)}
.tl-item.now .tl-dot{border-color:var(--m);background:var(--m);box-shadow:0 0 0 4px var(--m-bg)}
.tl-line{position:absolute;left:-20px;top:14px;bottom:-2px;width:2px;background:#E2E8F0}
.tl-item:last-child .tl-line{display:none}
.tl-item.done .tl-line{background:var(--green)}
.tl-st{font-size:13px;font-weight:700}.tl-item.now .tl-st{color:var(--m-d)}
.tl-dt{font-size:11px;color:var(--text3);font-weight:500;margin-top:1px}

/* Gate */
#gate{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#gate .g-ic{width:80px;height:80px;border-radius:24px;background:var(--m-bg);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
#gate .g-ic svg{width:38px;height:38px;stroke:var(--m);fill:none;stroke-width:1.8}
#gate h2{font-size:19px;font-weight:800;margin-bottom:8px}
#gate p{font-size:13.5px;color:var(--text2);line-height:1.55;max-width:280px}

.mt10{margin-top:10px}.mt14{margin-top:14px}.tc{text-align:center}.hide{display:none!important}
.hint{font-size:11.5px;color:var(--text3);font-weight:500;line-height:1.5;margin-top:8px}
.divider{height:1px;background:var(--border);margin:14px 0}
/* ── in-bot product search ── */
.srch-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:4px 6px 4px 12px}
.srch-bar:focus-within{border-color:var(--m-d)}
.srch-bar-ic svg{width:17px;height:17px;stroke:var(--text3);display:block}
.srch-input{flex:1;border:0;outline:0;font-size:14px;font-weight:600;color:var(--text1);background:transparent;padding:9px 0}
.srch-go{width:34px;height:34px;border:0;border-radius:var(--radius-xs);background:var(--m-d);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.srch-go svg{width:18px;height:18px;stroke:#fff}
.search-sugg{margin:4px 0 0;background:#fff;border-radius:var(--radius-xs);overflow:hidden}
.sugg-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13.5px;color:var(--text2);font-weight:600}
.sugg-item:last-child{border-bottom:0}
.sugg-item:active{background:var(--m-bg)}
.sugg-item svg{width:15px;height:15px;stroke:var(--text3);flex-shrink:0}
/* square 2-column product grid */
.srch-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:12px 16px 4px}
.srch-card{display:flex;flex-direction:column;border:1.5px solid var(--border);border-radius:var(--radius);background:#fff;overflow:hidden;transition:border .15s,box-shadow .15s}
.srch-card:active{border-color:var(--m-d);box-shadow:0 2px 12px rgba(0,0,0,.07)}
.srch-img{width:100%;aspect-ratio:1/1;background:#F1F5F9;cursor:pointer;overflow:hidden}
.srch-img{position:relative}
.srch-mall{position:absolute;top:6px;left:6px;z-index:2;background:#7C3AED;color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;letter-spacing:.5px}
.srch-rate{font-size:11px;color:var(--green);font-weight:700;display:flex;align-items:center;gap:3px;margin-top:2px}
.srch-img img{width:100%;height:100%;object-fit:cover;display:block}
.srch-name{font-size:12px;font-weight:700;color:var(--text1);line-height:1.3;padding:8px 9px 0;cursor:pointer;display:-webkit-box;display:box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.srch-price{font-size:14px;color:var(--text1);padding:5px 9px 0}
.srch-price s{color:var(--text4);font-size:11px;font-weight:500}
.srch-off{display:inline-block;font-size:9.5px;font-weight:800;color:var(--green);padding:2px 9px 0}
.srch-addbtn{margin:8px 9px 10px;border:0;border-radius:var(--radius-xs);background:var(--m-bg);color:var(--m-d);font-size:12.5px;font-weight:800;padding:8px 0;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.srch-addbtn svg{width:15px;height:15px;stroke:var(--m-d)}
.srch-addbtn.added{background:var(--green);color:#fff}
.srch-addbtn.added svg{stroke:#fff}
.srch-addbtn:disabled{opacity:.7}
/* add-to-cart bottom sheet */
.as-top{display:flex;gap:12px;padding:4px 16px 6px}
.as-img{width:88px;height:88px;border-radius:var(--radius);background:#F1F5F9 center/cover no-repeat;flex-shrink:0}
.as-info{flex:1;min-width:0}
.as-name{font-size:13.5px;font-weight:800;color:var(--text1);line-height:1.35;display:-webkit-box;display:box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.as-price{font-size:15px;color:var(--text1);margin-top:5px}
.as-price s{color:var(--text4);font-size:12px;font-weight:500}
.as-off{font-size:11px;font-weight:800;color:var(--green)}
.as-upi{font-size:11.5px;color:var(--m-d);font-weight:700;margin-top:3px;display:flex;align-items:center;gap:4px}
.as-stock{font-size:11px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}
.as-stock.ok{color:var(--green)}.as-stock.no{color:var(--red)}
/* UNMISTAKABLE out-of-stock banner — shown at the top of the add sheet when the
   whole product is OOS, so the subtle red stock line can never be missed. */
.as-oos-banner{display:flex;align-items:center;gap:7px;margin:0 16px 2px;padding:10px 12px;
  background:rgba(239,68,68,.12);border:1px solid var(--red);border-radius:var(--radius-xs);
  color:var(--red);font-size:12.5px;font-weight:800;line-height:1.3}
.btn.btn-oos{background:var(--border)!important;color:var(--text4)!important;cursor:not-allowed;opacity:.85}
.as-vtitle{font-size:12.5px;font-weight:800;color:var(--text2);padding:10px 16px 2px}
.as-vgrid{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 2px}
/* sticky Add-to-Cart footer so it's ALWAYS visible even with many sizes */
.as-qtyrow{display:flex;align-items:center;justify-content:space-between;padding:0 0 10px}
.as-qtylbl{font-size:12.5px;font-weight:800;color:var(--text2)}
.as-qty{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-xs);overflow:hidden}
.as-qtyv{min-width:34px;text-align:center;font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
#sheet-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* add-sheet: as-scroll akela scroll kare, sheet-body ka apna scroll off */
#sheet-body:has(.as-scroll){overflow:hidden}
.as-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.as-foot{flex-shrink:0;background:#fff;padding:12px 18px;padding-bottom:max(18px, env(safe-area-inset-bottom));margin:0 -18px 0;box-shadow:0 -6px 16px rgba(0,0,0,.06)}
/* order-detail delivery address */
.addr-body{font-size:12.5px;color:var(--text2);font-weight:500;line-height:1.55;margin-top:4px}
.addr-phone{font-size:12.5px;color:var(--text1);font-weight:700;margin-top:7px;display:flex;align-items:center;gap:5px}
.addr-phone svg{width:13px;height:13px;flex-shrink:0}
/* Account-address book rows (Address tab) */
.ma-row{border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 13px;margin-bottom:10px;background:var(--surface2)}
.ma-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13.5px;color:var(--text1)}
/* cancel-order reason picker */
.cx-reasons{display:flex;flex-direction:column;gap:8px}
.cx-opt{padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:13px;font-weight:600;color:var(--text1);cursor:pointer;transition:border .15s,background .15s}
.cx-opt.sel{border-color:var(--red);background:var(--red-bg);color:var(--red)}
</style>
</head>

<script>

/* ═══════════ Meesho Mini App — client ═══════════ */
// TOKEN — read from the URL, then REMEMBERED.
//
// This used to be read from location.search alone, and the next line scrubbed the
// query string out of the URL. So the token survived exactly one page load: any
// reload — a pull-to-refresh, the webview being restored from background, Telegram
// re-rendering the page, a crash-recovery — came back with an empty location.search,
// TOKEN='' and EVERY /api call answered "session" → "Session expired, please re-open
// the app from the bot chat". Nothing had actually expired: the token has no TTL at
// all (webauth.py signs the chat id and nothing else), the page had simply forgotten
// it. That is the flood of session-expired reports.
//
// So persist it. sessionStorage first (cleared when the webview really closes),
// with localStorage as the fallback for webviews that wipe sessionStorage on
// restore. Both are per-origin and per-device, so the token never leaves the
// user's own browser.
const API_BASE = (function(){
  if(window.API_BASE) return window.API_BASE;
  if(location.protocol === 'file:') return 'https://pricetrackerpro.fojadomain.fun';
  return '';
})();

window.setManualToken = function(){
  var el = document.getElementById('gate-tok');
  var v = el ? el.value.trim() : '';
  if(v){
    try{ sessionStorage.setItem('mtk', v); }catch(e){}
    try{ localStorage.setItem('mtk', v); }catch(e){}
    location.search = '?token=' + encodeURIComponent(v);
  }
};

const TOKEN = (function(){
  var t='';
  try{ t = new URLSearchParams(location.search).get('token') || ''; }catch(e){}
  if(t){
    try{ sessionStorage.setItem('mtk', t); }catch(e){}
    try{ localStorage.setItem('mtk', t); }catch(e){}
    return t;
  }
  try{ t = sessionStorage.getItem('mtk') || ''; }catch(e){}
  if(!t){ try{ t = localStorage.getItem('mtk') || ''; }catch(e){} }
  return t || '';
})();
// Scrub the token out of the visible URL right after reading it, so it doesn't
// linger in the webview history / a screenshot of the URL bar. (It's kept in the
// TOKEN variable and sent via the x-token header on every request.)
try{if(location.search&&location.search.indexOf('token=')>=0){history.replaceState(null,'',location.pathname);}}catch(e){}
const $ = id => document.getElementById(id);
let _myRef='';   // the user's own saved referral code
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const money = n => '₹'+Number(n||0).toLocaleString('en-IN');
// Meesho's CDN serves a size variant in the filename (…/x_512.jpg). We were
// requesting 512px for boxes ~180px, ~52px and ~44px wide — MEASURED, a 40-item
// search grid pulled 1.73 MB, about 9s on a 1.6 Mbit connection, for images with
// ~3x more pixels than the screen can show. Rewrite the suffix to fit the box.
// Falls through untouched for any URL that doesn't match the pattern.
// If a resized variant is missing on the CDN, retry the ORIGINAL url once, then
// give up quietly. Without this, a size the CDN happens not to have would render
// as a broken tile — a worse outcome than the bytes being saved.
// ── STALE-WHILE-REVALIDATE CACHE ────────────────────────────────────────
// Every tab used to wait on the network before drawing anything: switching
// Orders -> Account -> Orders re-fetched a list the app had shown seconds ago,
// so the user stared at a skeleton each time. That is what "everything is
// loading" means — not that any one call is slow, but that nothing is ever
// remembered.
//
// So keep the last good response per key. A revisit paints instantly from it and
// a fresh read replaces it when it lands. Memory only, cleared on app close.
const _rc = {};
function rcGet(k, maxAgeMs){
  const e = _rc[k];
  if(!e) return null;
  if(maxAgeMs && (Date.now() - e.t) > maxAgeMs) return null;
  return e.v;
}
function rcSet(k, v){ try{ _rc[k] = {v: v, t: Date.now()}; }catch(e){} }
// Is the cached entry young enough that we should not revalidate at all?
//
// The four render paths used to paint from cache and then ALWAYS re-fetch, so
// the TTL only decided whether a skeleton flashed — never whether a request was
// sent. MEASURED over a 614s production window: /api/accounts 755 calls for 272
// app opens (2.78x), /api/address 658 (2.42x), /api/orders 754 (2.77x),
// /api/cart 522 (1.92x) — and 82-93% of those were duplicate pairs less than 2s
// apart. That is 1,601 of 6,776 requests (23.6% of ALL traffic) re-fetching data
// the client had already painted. Every in-app mutation calls rcDrop, so
// skipping the revalidate inside this window cannot show a stale local change.
function rcFresh(k, freshMs){
  const e = _rc[k];
  return !!(e && (Date.now() - e.t) < freshMs);
}
// GENERATION GUARD. Every async write-back must prove the world it was fetched
// for still exists. Without this a slow response lands after the user has moved
// on and overwrites newer truth: MEASURED, a prefetch begun before an order was
// placed landed after it and restored the pre-order list, so the user's just-placed
// order vanished for up to 120s. rcDrop bumps the generation, so anything already
// in flight is discarded on arrival.
let _rcGen = 0;
function rcGen(){ return _rcGen; }
function rcSetIf(k, v, gen, phone){
  if(gen !== _rcGen) return false;                    // cache was invalidated
  if(phone !== undefined && phone !== _selPhone) return false;  // account changed
  rcSet(k, v); return true;
}
function rcDrop(k){ _rcGen++; try{ if(k) delete _rc[k]; else for(const x in _rc) delete _rc[x]; }catch(e){} }
// DROP ONLY WHAT THE ACCOUNT OWNS.
//
// resetOrderFlow() called the bare rcDrop(), which wipes EVERY key. But only
// 'cart:<phone>' and 'orders:<phone>' belong to an account — 'address' and
// 'accounts' are user-scoped (one DB row for the whole user, identical whichever
// account is selected) and 'refstats' is re-keyed by phone below.
//
// MEASURED in a headless Telegram-Android run: tapping a different account cost
// an extra /api/address refetch and made the next Orders tab paint block for
// 462ms on a cold key, even though boot had already prefetched both. Keeping the
// user-scoped keys makes the account switch cost only what genuinely changed.
// Still bumps the generation, so anything already in flight is discarded.
function rcDropAccount(){
  _rcGen++;
  try{ for(const x in _rc){ if(x.indexOf('cart:')===0||x.indexOf('orders:')===0||x==='refstats') delete _rc[x]; } }catch(e){}
}
// ── IDLE / LOW-PRIORITY WORK ────────────────────────────────────────────
// Run speculative work when the main thread is free, so a prefetch never
// competes with the paint the user is actually waiting for. requestIdleCallback
// is missing on older Android WebViews (and on every iOS webview), so fall back
// to a short setTimeout — the previous behaviour — rather than dropping the work.
function idle(fn,ms){
  try{
    if(typeof requestIdleCallback==='function'){ requestIdleCallback(fn,{timeout:ms||1200}); return; }
  }catch(e){}
  setTimeout(fn, ms||120);
}
// MAY WE SPEND A REQUEST ON A GUESS RIGHT NOW?
//
// A prefetch is worth nothing and costs real capacity when the user cannot see
// the result or is in the middle of paying. Three refusals:
//   1. hidden tab — the webview is backgrounded, so nothing we fetch gets looked
//      at, and Telegram keeps the page alive far longer than the user's attention.
//   2. an open checkout (_summary) or an in-flight checkout call (_checkoutBusy) —
//      money is on screen; a speculative /api/cart racing the summary is exactly
//      the class of bug the rcGen guard exists to catch, so don't create it.
//   3. an open sheet — a QR/payment/add sheet is a foreground task of its own.
function prefetchOK(){
  try{ if(document.visibilityState==='hidden') return false; }catch(e){}
  if(_summary || _checkoutBusy || _sheetOpen) return false;
  return true;
}

function imgFallback(el){
  try{
    const full=el.getAttribute('data-full')||'';
    if(full && !el.dataset.retried){ el.dataset.retried='1'; el.src=full; return; }
  }catch(e){}
  el.style.display='none';
}
const imgSize = (u,px) => {
  u = String(u||'');
  if(!u) return '';
  try{ return u.replace(/_(\d{2,4})\.(jpg|jpeg|png|webp)(\?.*)?$/i,
                        (m,n,ext,q)=> (Number(n)>px ? '_'+px+'.webp'+(q||'') : m)); }
  catch(e){ return u; }
};
// Digit-only input, clamped to `max` length (e.g. 10 for phone, 6 for OTP/pin).
function _num(el,max){if(!el)return;el.value=(el.value||'').replace(/\D/g,'').slice(0,max);}
let _ordSync=false, _ordSyncStop=false;
// Above this many accounts the button switches to a live x/y counter —
// below it the sweep is over before a counter would even be read.
const _ordChunkHint=25;
let _tab='account', _accounts=[], _selPhone=null, _product=null, _selVar=null, _payMethod='cod', _summary=null, _toastT=null, _busy=false, _sheetOpen=false, _lastOrderAddr=null, _checkoutBusy=false;

/* ---- SVG icon set (crisp, stroke) ---- */
const IC = {
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.9.36 1.79.7 2.63a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.44-1.27a2 2 0 0 1 2.11-.45c.84.34 1.73.57 2.63.7A2 2 0 0 1 22 16.92z"/>',
  key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5 18 5l3 3"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  wallet:'<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
  cod:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  upi:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  chevD:'<path d="m6 9 6 6 6-6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',

function friendly(e){
  if(!e)return 'Something went wrong — please try again.';
  const s=String(e).trim();
  if(ERR_MAP[s])return ERR_MAP[s];
  // Case-insensitive fallback match for the short codes.
  const lc=s.toLowerCase();
  for(const k in ERR_MAP){if(k.toLowerCase()===lc)return ERR_MAP[k];}
  // Anything that looks technical (stack/exception/HTTP/JSON) → clean generic,
  // never leak internals to the user. NOTE: do NOT reject on length alone — a clean
  // human sentence (e.g. "This number is already registered…", 142 chars) must show
  // in full; only gate very long messages that also look like a code dump.
  if(/[{}\[\]]|Traceback|Exception|Error:|HTTP\s?\d|Proxy failed|status\s?\d|str\(e\)|\bat\s+\w+:\d/i.test(s))
    return 'Something went wrong — please try again.';
  if(s.length>240) return 'Something went wrong — please try again.';
  // A BARE CODE is not a message. Anything that is only lowercase letters,
  // digits and underscores is an internal identifier that ERR_MAP simply has no
  // entry for — users were literally being shown "timeout", "server_error",
  // "relogin_needed", "already_ordered", "search_failed". `timeout` and
  // `server_error` are error_guard's universal fallbacks, so ANY slow or throwing
  // handler in the whole API ends up here. Catch the class, not one case at a time.
  if(/^[a-z0-9_]+$/.test(s)) return 'Something went wrong — please try again.';
  // Dynamic developer strings (the field name is appended, so no exact key can
  // ever match them).
  if(/^Missing required fields:/i.test(s)) return 'Something went wrong — please reopen the app.';
  // A human sentence from the backend is safe to show as-is.
  return s;
}

async function api(path,body,opts){
  if(_sessionDead)return null;
  opts=opts||{};
  const opt={method:body?'POST':'GET',headers:{'x-token':TOKEN}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
  // SECURITY: send the auth token ONLY via the x-token header, never in the URL
  // query — a query-string token leaks via Referer, webview/browser history and
  // tunnel access logs, and (being non-expiring) is then a permanent credential.
  const url=(API_BASE?API_BASE+path:path)+(path.includes('?')?'&':'?')+'_='+Date.now();
  // ABORT JUST UNDER THE SERVER'S BUDGET, NOT 15s AFTER IT.
  //
  // The default was 35000. The server kills a normal handler at REQ_TIMEOUT=20s
  // (webapi.py `_REQ_TIMEOUT`) and answers `timeout`, so from 20s to 35s the client
  // was holding a spinner open on a request that could no longer produce anything —
  // MEASURED in a headless Telegram-Android run against a hung endpoint: the client
  // gave up after 35008ms, 15s of dead screen past the point of no return, and the
  // socket stayed attached to a handler on an already-saturated box for all of it.
  // 19s aborts just BEFORE the server's own deadline, so the slot is released at
  // the first moment the answer is known to be worthless.
  //
  // MONEY PATHS KEEP THE LONG BUDGET. The server gives its _SLOW_PATHS list
  // (webapi.py: /place, /check-payment, /login, /cart/checkout, /checkout/check,
  // /pay) REQ_TIMEOUT_LONG=30s, because placing an order and confirming a payment
  // legitimately take that long. Aborting those at 19s would be a CORRECTNESS bug,
  // not a speed win: placeOrder() already documents that the server does NOT roll
  // back on a client abort, so a premature abort loses a slot and invites a
  // duplicate order. Give them 29s — still just under the server's own deadline.
  // Mirror of the server's _SLOW_PATHS substring test, kept in the same order and
  // form so the two lists can be diffed by eye. VERIFIED against webapi.py: this
  // makes /api/cart/checkout, /api/checkout/check and /api/login/* long, and leaves
  // /api/checkout/cod, /api/checkout/upi and /api/checkout/summary on the short
  // 20s budget — which is what the server actually gives them.
  const _SLOW=['/place','/check-payment','/check_payment','/login','/offer/refresh',
               '/cart/checkout','/checkout/check','/pay'];
  let _slow=false;
  for(let i=0;i<_SLOW.length;i++){ if(path.indexOf(_SLOW[i])>=0){_slow=true;break;} }
  const _to_ms=(opts&&opts.timeout)||(_slow?29000:19000);
  // AUTO-RETRY ONE TRANSIENT NETWORK BLIP before showing "Network error".
  //
  // A single dropped packet / brief proxy hiccup used to surface INSTANTLY as a
  // red "Network error, try again" toast — the "network error bahut aata hai"
  // complaint — even though a 400ms retry almost always succeeds. On mobile +
  // a proxied backend these blips are common and invisible to a retry.
  //
  // SAFETY: only IDEMPOTENT calls retry. Money/order/login paths (_slow) are
  // NEVER auto-retried — the server does not roll back on a client abort, so a
  // retry after the request may have already landed could double-place an order
  // or double-charge. Those still fail fast to the user, exactly as before.
  const _canRetry = !_slow && !opts.noRetry;
  const _attempts = _canRetry ? 2 : 1;
  let _lastErr=null;
  for(let _a=0; _a<_attempts; _a++){
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),_to_ms);opt.signal=ctrl.signal;
    try{let r=await fetch(url,opt);
      if(r.status===404 && !API_BASE){
        const fbUrl='https://pricetrackerpro.fojadomain.fun'+path+(path.includes('?')?'&':'?')+'_='+Date.now();
        r=await fetch(fbUrl,opt);
      }
      clearTimeout(to);const j=await r.json();
      // A present-but-invalid token makes every call return {ok:false,error:'session'}.
      // Show the re-open gate instead of letting screens render as "empty".
      if(j&&j.ok===false&&j.error==='session'){showSessionGate();return null}
      return j}
    catch(e){
      clearTimeout(to); _lastErr=e;
      // More attempts left → short backoff and try again on a fresh lane.
      if(_a<_attempts-1){ await new Promise(r=>setTimeout(r,400*(_a+1))); continue; }
    }
  }
  // Every attempt failed. Background polls pass {silent:true} so a flaky
  // connection doesn't spam a red toast every 5s while the QR sheet is open.
  if(!opts.silent)toast('Network error, try again','err');
  return null
}

// CAP THE LIST. Every account was rendered on every paint, and renderAccList()
// is called on boot, on every account tap (to move the "Selected" pill) and after
// every add/delete. MEASURED in a headless mobile Chrome with the real worst case
// on this bot — 257 accounts — that was 5,915 DOM nodes and a 21,091px-tall list
// built in 14.3ms of scripting plus 20.4ms of layout, EVERY TAP, on a mid-range
// desktop CPU; a low-end Android is several times slower and this is the tab the
// app boots into.
//
// 25 is above the number an ordinary user has (so they never see the button at
// all) and far below the point where layout cost is felt. "Show more" reveals
// another 25 without a request — the whole list is already in memory.
let _accShown=25;

// ── Account search + filter (large-wallet management) ──
// _accounts can be 1000-1500 for a heavy user; search + status filter make it
// navigable. All client-side — the full list is already in memory. renderAccList()
// filters first, then applies the show-more cap to the RESULT, so only ~25 cards
// are ever in the DOM regardless of wallet size.
let _accSearch='', _accFilter='all';
function _accStage(a){ return ((a&&(a.stage_key||''))+'').toLowerCase()+' '+((a&&(a.order_status||''))+'').toLowerCase(); }
function _accInFilter(a,f){
  if(f==='ready')   return !a.placed;
  if(f==='ordered') return !!a.placed;
  if(f==='issue')   return /cancel|return/.test(_accStage(a));
  return true;  // 'all'
}
function _accCount(f){ let n=0; for(const a of _accounts){ if(a&&_accInFilter(a,f)) n++; } return n; }
function _accFiltered(){
  const q=(_accSearch||'').replace(/\D/g,'');
  return _accounts.filter(a=>{
    if(!a) return false;
    if(!_accInFilter(a,_accFilter)) return false;
    if(q){ const ph=(a.phone||'').replace(/\D/g,''); if(!ph.includes(q)) return false; }
    return true;
  });
}
function accSearchInput(v){ _accSearch=v||''; _accShown=ACC_PAGE; renderAccList(); }
function accSearchClear(){ _accSearch=''; _accShown=ACC_PAGE; const s=$('acc-srch'); if(s){s.value='';s.focus();} const x=document.querySelector('.acc-srch-x'); if(x)x.remove(); renderAccList(); }
function accSetFilter(f){
  _accFilter=f; _accShown=ACC_PAGE; haptic('light');
  const box=$('acc-filters');
  if(box) box.querySelectorAll('.acc-chip').forEach(c=>c.classList.toggle('sel', c.getAttribute('data-f')===f));
  renderAccList();
}

function renderAccList(){
  const el=$('acc-list');if(!el)return;
  if(!_accounts.length){el.innerHTML=emptyBox('user','No accounts yet','Login with OTP or import a JSON to get started.');return}
  // The SELECTED account must always be on screen, even when it sits past the cap
  // — otherwise the header says "Ordering from +91…" and the list appears not to
  // contain it. PIN it to the top instead of widening the window: extending the
  // slice to reach index 200 would render 201 cards and give back the whole win in
  // exactly the heavy-user case the cap exists for (MEASURED: 201 cards vs 25).
  // It is not re-sorted into the body, so no account moves under the user's finger.
  // Filter + search first, then cap — so the DOM only ever holds ~_accShown cards
  // no matter how big the wallet is.
  const _base=_accFiltered();
  if(!_base.length){
    el.innerHTML=`<div class="hint" style="margin:2px 16px 10px;text-align:center">No accounts match`
      +(_accSearch?` “${esc(_accSearch)}”`:'')+`. <a onclick="accSearchClear();accSetFilter('all')" style="color:var(--m-d);font-weight:700;cursor:pointer">Clear</a></div>`;
    return;
  }
  let _vis=_base.slice(0,_accShown);
  let _pin=null;
  // Keep the SELECTED account on screen when it's in the current view but past the
  // cap. Only pin it if it actually matches the active filter/search — don't drag a
  // filtered-out account back in while the user is narrowing the list.
  if(_selPhone && !_vis.some(a=>a&&a.phone===_selPhone))
    _pin=_base.find(a=>a&&a.phone===_selPhone)||null;
  if(_pin) _vis=[_pin].concat(_vis);

  // lifted out of the tail, so it must not be counted as hidden as well.
  const _rest=Math.max(0,_base.length-_accShown-(_pin?1:0));
  el.innerHTML='<div style="margin:0 16px">'+_vis.map(a=>{
    const used=a.placed;const sel=_selPhone===a.phone;
    // Export is allowed once ordered OR after a 1-slot unlock. `used` still drives the
    // status pill (ordered vs ready); `canExport` only drives the JSON/lock button.
    const canExport=used||a.export_unlocked;
    // No bonus number here — the login-time/logged-in FOD probes are only hints
    // and disagree with the real cart discount, so showing a ₹ figure misleads.
    // The actual bonus is shown at checkout (Bill Details) from the live cart.
    // Status badge: "Ordered" once an order is placed, else "Ready". We do NOT
    // show a "Registered" badge off `new_account` — that flag comes from Meesho's
    // login `user.new`, which is unreliable (it reads false for many genuinely
    // fresh accounts right after signup), so it wrongly labelled ~half the accounts
    // "Registered". The real welcome-bonus check happens live at checkout anyway.
    // SMART STAGE BADGE. `placed` alone only ever said "Ordered" — it is written
    // once at order time and never updated, so a parcel that shipped or arrived
    // days ago still read "Ordered" forever. When the Check-orders sweep has run,
    // a.order_status carries Meesho's own live stage and we colour it by meaning:
    // green = done, blue = moving, red = cancelled/returned.
    const _stage=(a.order_status||'').trim();
    const _sk=(a.stage_key||'').toLowerCase();
    let status;
    if(_sk==='delivered'||/deliver/i.test(_stage))
      status=`<span class="pill pill-green">${ico('check',11)} ${esc(_stage||'Delivered')}</span>`;
    else if(_sk==='shipped'||/ship|on the way|transit|out for/i.test(_stage))

    else if(_sk==='cancelled'||/cancel/i.test(_stage))
      status=`<span class="pill pill-red">${ico('x',11)} ${esc(_stage||'Cancelled')}</span>`;
    else if(_sk==='returned'||/return/i.test(_stage))
      status=`<span class="pill pill-orange">${ico('x',11)} ${esc(_stage||'Returned')}</span>`;
    else if(used)
      status=`<span class="pill pill-green">${ico('check',11)} ${esc(_stage||'Ordered')}</span>`;
    else
      status=`<span class="pill pill-m">${ico('check',11)} Ready</span>`;
    // Meesho's own one-liner ("Delivery by Tue, 08 Sep") when the sweep found one.
    const _sub=(a.stage_detail||'').trim();
    return `<div class="acc-card ${used?'used':''} ${sel?'sel':''}" onclick="selectAccount('${esc(a.phone)}')">
      <div class="acc-av">${ico('user',20,used?'var(--green)':'var(--m-d)')}</div>
      <div class="acc-info"><div class="acc-ph">${esc(a.phone)}</div>
      <div class="acc-meta">${status}${sel?`<span class="pill pill-sel">${ico('check',10)} Selected</span>`:''}</div>
      ${_sub?`<div class="acc-sub">${esc(_sub)}</div>`:''}</div>
      <div class="acc-actions">
        ${canExport
          ? `<button class="acc-act" title="Copy account JSON" onclick="event.stopPropagation();copyAccount('${esc(a.phone)}',this)">${svg('json')}</button>`
          : `<button class="acc-act acc-act-lock" title="Export locked — tap to unlock for 1 slot" onclick="event.stopPropagation();copyAccount('${esc(a.phone)}',this)">${svg('lock')}</button>`}
        <button class="acc-act" title="Refresh session" onclick="event.stopPropagation();refreshAccount('${esc(a.phone)}',this)">${svg('refresh')}</button>
        <button class="acc-del" title="Delete account" onclick="event.stopPropagation();delAccount('${esc(a.phone)}')">${svg('trash')}</button>
      </div></div>`;
  }).join('')
  +(_rest>0?`<button class="btn btn-ghost mt10" onclick="accShowMore()">${svg('chevD')} Show ${Math.min(_rest,ACC_PAGE)} more · ${_rest} hidden</button>`:'')
  +'</div>';
}
async function refreshAllOrders(btn){
  // Ask the server to re-check EVERY saved account against Meesho and tell us
  // what stage each order is really at. The stored `placed` flag is written once
  // at order time and never updated, so without this a shipped or delivered
  // parcel still shows "Ordered" forever.
  //
  // This is the one place in the app that deliberately costs several upstream
  // calls, so it is explicit (a button), guarded against double-taps, and shows
  // progress while it runs.
  if(_ordSync) return;
  _ordSync=true; _ordSyncStop=false;
  const lbl=btn?btn.querySelector('span'):null;
  const _old=lbl?lbl.textContent:'';
  if(btn){btn.classList.add('busy');btn.disabled=true}
  const _n=_accounts.length;
  if(lbl) lbl.textContent = _n>_ordChunkHint ? ('Checking 0/'+_n+'…')
                          : (_n>8 ? ('Checking '+_n+'…') : 'Checking…');
  // WALK THE LIST IN CHUNKS.
  //
  // A single request cannot sweep a large wallet: MEASURED, the biggest account
  // list is 257 and 600 is plausible, which is 26-60s of upstream work while the
  // client aborts at 19s — the user got an error and NOTHING was saved. Each
  // chunk is its own request that saves what it found, so a big wallet finishes
  // in visible steps and a failure half way keeps everything before it.
  let off=0, tot=0, live=0, checked=0, guard=0;
  try{
    while(true){
      if(++guard>60) break;                    // 60 x 25 = 1500 accounts ceiling
      const r=await api('/api/accounts/refresh',{offset:off},{timeout:60000});
      if(!(r&&r.ok&&Array.isArray(r.accounts))){
        if(checked===0){ toast(friendly(r&&r.error)||'Could not check orders','err'); return; }
        break;                                  // partial result is still worth keeping
      }
      tot=r.total||tot; checked+=r.checked||0; live+=r.live||0;

      // Merge this chunk onto the cards we already hold — no refetch needed.
      const by={};
      r.accounts.forEach(x=>{ if(x&&x.phone) by[x.phone]=x; });
      _accounts.forEach(a=>{
        const x=by[a.phone];
        if(!x||!x.ok) return;
        a.order_status=x.stage||'';
        a.stage_key=x.stage_key||'';
        a.stage_detail=x.detail||'';
        a.placed=(x.orders||0)>0;
      });
      rcSet('accounts',_accounts);
      renderAccList();                          // paint progress as it lands

      // Keep the button's label honest while a long sweep runs.
      if(lbl && tot>_ordChunkHint) lbl.textContent='Checking '+Math.min(checked,tot)+'/'+tot+'…';

      off=r.next_offset||(off+(r.checked||0));
      if(r.done || !r.checked) break;
      if(_ordSyncStop) break;                   // user left the screen
    }
    // The All-orders list is built from the same stored stages, so drop its
    // cache and repaint it too — otherwise the user taps Update, sees the
    // toast, and the rows in front of them still show the old status.
    rcDrop('orders:ALL');
    if(_tab==='orders' && _ordScope==='all') renderOrders();
    toast(live===checked?('Checked '+checked+' account'+(checked===1?'':'s'))
                        :('Checked '+live+' of '+checked+' — some could not be read'),
          live?'suc':'err');
    haptic('light');
  }catch(e){
    if(checked>0){
      rcDrop('orders:ALL');
      if(_tab==='orders' && _ordScope==='all') renderOrders();
      toast('Checked '+checked+' of '+(tot||checked)+' — stopped early','err');
    }else{
      toast('Could not check orders','err');
    }
  }finally{
    _ordSync=false; _ordSyncStop=false;
    if(btn){btn.classList.remove('busy');btn.disabled=false}
    if(lbl) lbl.textContent=_old||'Check orders';
  }
}

// ── Clipboard (iOS-safe) ─────────────────────────────────────────────
// iOS Safari / Telegram-WebView block navigator.clipboard.writeText() unless
// it runs in the SAME synchronous turn as the tap (user-activation), and the
// old opacity:0 textarea + .select() does NOT copy on iOS at all — iOS needs a
// contentEditable range, not a form select. _clipWrite() does the async API
// first (works on Android + desktop) and, on any failure, an iOS-correct
// execCommand path. Returns true only if the copy actually happened.
function _isIOS(){
  return /iP(hone|od|ad)/.test(navigator.userAgent)
    || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); // iPadOS
}
async function _clipWrite(txt){
  // 1) Async Clipboard API — best path, but on iOS it FAILS after an await gap,
  //    so treat a throw as "fall through", never as success.
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(txt);
      return true;
    }
  }catch(e){/* fall through to execCommand */}
  // 2) execCommand fallback done the iOS way: a real, on-screen-but-tiny,
  //    NON-opacity-0 textarea, made contentEditable+readonly so iOS lets us set
  //    a selection Range, then execCommand('copy').
  try{
    const ta=document.createElement('textarea');
    ta.value=txt;
    ta.contentEditable='true';
    ta.readOnly=true;                     // stops the iOS keyboard popping up
    ta.style.position='fixed';
    ta.style.top='0';ta.style.left='0';
    ta.style.width='1px';ta.style.height='1px';
    ta.style.padding='0';ta.style.border='0';
    ta.style.fontSize='16px';             // <16px makes iOS zoom the viewport
    ta.style.background='transparent';
    document.body.appendChild(ta);
    if(_isIOS()){
      const range=document.createRange();
      range.selectNodeContents(ta);
      const sel=window.getSelection();
      sel.removeAllRanges();sel.addRange(range);
      ta.setSelectionRange(0,txt.length);
    }else{
      ta.select();
    }
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}
// Last-resort fallback: show the text in a selectable sheet so the user can
// long-press → Copy manually. This ALWAYS works, even when the browser blocks
// programmatic copy entirely (older iOS / locked-down WebViews).
function _copySheet(txt,label){
  const dlg=$('cdlg'), mask=$('cmask');
  dlg.innerHTML=`<div class="cdlg-h">${esc(label||'Copy')}</div>
    <div class="cdlg-b" style="margin-bottom:10px">Long-press the text below, then tap <b>Copy</b>.</div>
    <textarea readonly id="copybox" style="width:100%;height:160px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--surface2);color:var(--text);-webkit-user-select:text;user-select:text;box-sizing:border-box"></textarea>
    <div class="cdlg-btns"><button class="btn btn-m" id="copydone">Done</button></div>`;
  // set value via property (not innerHTML) so quotes/newlines stay intact
  const box=$('copybox'); box.value=txt;
  mask.classList.add('show');
  const done=()=>{mask.classList.remove('show')};
  $('copydone').onclick=done;
  mask.onclick=(e)=>{if(e.target===mask)done()};
  // pre-select so a single long-press → Copy is enough
  try{box.focus();box.setSelectionRange(0,txt.length);}catch(e){}
  haptic('light');
}
// Copy any text; on total failure, open the manual-copy sheet.
async function copyText(txt,btn,okMsg){

      title:'Unlock JSON export?',

// the user tapping Retry over and over. The top tier is rare, so one hunt window often
// misses it and the backend returns hunt_retry. Instead of parking on a manual button,
// loginStart re-runs itself automatically on a hunt-miss (keeping the same number), and
// the "not found yet" card shows a live attempt counter + a Stop button so the user can
// bail. _autoRetry carries the phone across auto re-runs; _autoStop lets Stop cancel it.

async function loginStart(_auto){

  // _autoRetry, the inputs are already gone). A manual call reads the inputs.
  let phone, _ref;
