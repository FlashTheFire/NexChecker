async function loginStartCore(phone,_ref,_auto){
  // phone + _ref are passed in (the wrapper loginStart read them from the inputs,
  // or from _autoRetry on a self-scheduled retry — the inputs are gone by then).
  // Tier = a MINIMUM floor; the hunt always chases the lowest UPI at/above it. It
  // keeps searching until it finds the ₹9 tier, so allow a long timeout (the ₹9
  // session is ~10% rare — worst case it hunts for a couple of minutes).
  // LIVE PROGRESS instead of a blurred, frozen screen.
  //
  // This is the one genuinely long wait in the app (5-25s) and it used to be a
  // full-screen blur with a context-free spinner — the user cannot tell whether
  // anything is happening. The server publishes what the hunt loop already knows,
  // so show it: sessions checked, and the discount found so far. "₹230 found" is
  // the load-bearing line — it turns waiting into watching money being earned.
  haptic('light');
  const _pn=phone;
  $('login-box').innerHTML=`<div class="card" style="background:var(--m-bg);border-color:var(--m-bg2)">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--m-bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0">${ico('gift',22,'var(--m-d)')}</div>
        <div style="flex:1">
          <div style="font-weight:800;font-size:16px;color:var(--m-d)" id="hp-h">Finding your best offer…</div>
          <div style="font-size:11.5px;color:var(--text2);font-weight:500;margin-top:2px" id="hp-s">Checking sessions on Meesho</div>
        </div>
      </div>
      <div style="height:4px;border-radius:2px;background:var(--m-bg2);margin-top:12px;overflow:hidden">
        <div id="hp-bar" style="height:100%;width:4%;background:var(--m-d);transition:width .4s"></div>
      </div>
    </div>`;
  let _hpStop=false; const _hpT0=Date.now();
  (async function poll(){
    while(!_hpStop){
      await new Promise(r=>setTimeout(r,1200));
      if(_hpStop)break;
      let p=null;
      try{ p=await api('/api/login/progress?phone='+encodeURIComponent(_pn),null,{silent:true}); }catch(e){}
      if(_hpStop||!p||!p.ok||!p.running)continue;
      const h=$('hp-h'), sub=$('hp-s'), bar=$('hp-bar');
      if(!h||!sub||!bar)break;
      const got=p.best_fod||0, want=p.want_fod||0;
      if(got>0 && want>0 && got>=want){
        h.textContent='₹'+got+' OFF found — logging you in';
        sub.textContent='Best possible discount secured';
      }else if(got>0){
        h.textContent='Best so far: ₹'+got+' OFF';
        sub.textContent='Still looking for ₹'+(want||230)+' — '+(p.attempts||0)+' checked';
      }else if(p.attempts>0){
        sub.textContent=p.attempts+' sessions checked';
      }else{
        // Pool-served: no local probes run, so "0 sessions checked" would be both
        // confusing and untrue about what is happening.
        sub.textContent='Securing your offer…';
      }
      // The bar must always be MOVING. A pool-served login reports attempts=0 and
      // elapsed=0 — the fast, common path — so a bar driven only by elapsed/deadline
      // sat frozen at 4% for the whole wait and looked like the app had hung.
      // Drive it off wall-clock since the tap, which is always true, and let a
      // real elapsed reading push it further along when there is one.
      const secs=(Date.now()-_hpT0)/1000;
      const byTime=Math.min(0.9, secs/12);
      const byServer=p.deadline?Math.min(0.96,(p.elapsed||0)/p.deadline):0;
      const frac=Math.max(byTime,byServer);

    _hpStop=true;
  }
  if(!r||!r.ok){

    // below-threshold / bad number (try a different one).
    // hunt_retry is NOT a network fault — it means the hunt ran fine but no
    // session met the discount bar. It also carries retry:true (the user SHOULD
    // press again), and this test used to lump it in with `r.retry`, so a perfectly
    // healthy hunt reported "Couldn't reach Meesho" and the real reason — and the
    // promise that they still get the full discount — was never shown.
    const isHuntMiss=r && r.error==='hunt_retry';
    // `timeout` is error_guard killing the handler at the request budget. It is a
    // THIRD outcome, distinct from 'network' and from a client-side abort, and it
    // means the hunt was still working — often it had already FOUND the session.
    // Retrying is the right advice, so it gets the retry card, not the red one.
    const isSlow=r && r.error==='timeout';
    const isNet=!isHuntMiss && !isSlow && (!r || r.retry || r.error==='network');
    const ph=(r&&r.phone)?r.phone.replace('+91',''):'';
    if(isNet){
      $('login-box').innerHTML=`<div class="warn-card"><div class="warn-ic">${ico('refresh',20,'var(--orange)')}</div><div class="warn-tx"><div class="warn-h" style="color:var(--orange)">Network busy — try again</div><div class="warn-b">Couldn't reach Meesho just now. This is a connection hiccup, not your number. Tap retry.</div></div></div>
        <div class="field"><label class="flbl">Phone Number</label><input class="inp" id="lg-phone" inputmode="numeric" maxlength="10" oninput="_num(this,10)" value="${esc(ph)}" placeholder="10-digit mobile"></div>
        <div class="field"><label class="flbl">Referral (optional)</label><input class="inp" id="lg-ref" placeholder="Link or code — leave blank to skip"></div>
        <button class="btn btn-m" onclick="loginStart()">${svg('refresh')} Retry</button>`;
      haptic('heavy');return;
    }
    if(isSlow){
      $('login-box').innerHTML=`<div class="warn-card"><div class="warn-ic">${ico('refresh',20,'var(--orange)')}</div><div class="warn-tx"><div class="warn-h" style="color:var(--orange)">Taking longer than usual</div><div class="warn-b">Finding the offer took too long. Your number is fine — just tap Retry.</div></div></div>
        <div class="field"><label class="flbl">Phone Number</label><input class="inp" id="lg-phone" inputmode="numeric" maxlength="10" oninput="_num(this,10)" value="${esc(ph)}" placeholder="10-digit mobile"></div>
        <div class="field"><label class="flbl">Referral (optional)</label><input class="inp" id="lg-ref" placeholder="Link or code — leave blank to skip"></div>
        <button class="btn btn-m" onclick="loginStart()">${svg('refresh')} Retry</button>`;
      haptic('heavy');return;
    }
    if(isHuntMiss){
      // The number is fine and the user IS eligible — the hunt simply did not land
      // a session at the full (highest) discount this window. The top tier is rare,
      // so instead of parking on a manual Retry the bot KEEPS HUNTING on its own
      // (operator: "hamesha highest hi dena chahiye, har cheez try karo"): re-run
      // automatically with the same number until the full discount lands, showing a
      // live attempt count + a Stop button so the user is never trapped.
      // Clamp: unvalidated server data going straight into user copy.
      let bar=parseInt(r.min_fod_hunt,10); if(!(bar>0&&bar<=1000)) bar=230;
      if(_autoStop){ _autoRetry=null; return; }   // user pressed Stop mid-flight
      const n=((_autoRetry&&_autoRetry.n)||0)+1;
      // HIGH cap, NOT infinite (operator: "limit jada rakho but infinity mat rakho").
      // ~200 auto-attempts is a long, generous search for the top tier, but it can't
      // loop forever hammering the backend / a number that can never qualify.
      const CAP=200;
      if(n>CAP){
        _autoRetry=null;
        $('login-box').innerHTML=`<div class="warn-card"><div class="warn-ic">${ico('gift',20,'var(--orange)')}</div><div class="warn-tx"><div class="warn-h" style="color:var(--orange)">Full ₹${esc(bar)} discount not found yet</div><div class="warn-b">We only give the full ₹${esc(bar)} discount — never less. It's taking longer than usual for this number. Tap Retry to keep searching, or try a different number.</div></div></div>
          <div class="field"><label class="flbl">Phone Number</label><input class="inp" id="lg-phone" inputmode="numeric" maxlength="10" oninput="_num(this,10)" value="${esc(ph)}" placeholder="10-digit mobile"></div>
          <div class="field"><label class="flbl">Referral (optional)</label><input class="inp" id="lg-ref" placeholder="Link or code — leave blank to skip"></div>
          <button class="btn btn-m" onclick="loginStart()">${svg('refresh')} Retry</button>`;
        haptic('heavy'); return;
      }
      _autoRetry={phone:_pn, n};
      $('login-box').innerHTML=`<div class="warn-card"><div class="warn-ic">${ico('gift',20,'var(--orange)')}</div><div class="warn-tx"><div class="warn-h" style="color:var(--orange)">Getting your full ₹${esc(bar)} discount…</div><div class="warn-b">We only give the full ₹${esc(bar)} discount — never less. Still searching (attempt ${n}). Please keep this open.</div></div></div>
        <button class="btn btn-ghost" onclick="stopAutoRetry()">Stop</button>`;
      haptic('light');
      // Small gap so the UI paints + we don't hammer the backend; then hunt again.
      setTimeout(()=>{ if(!_autoStop) loginStart(true); }, 600);
      return;
    }
    _autoRetry=null; _autoStop=false;   // hard fail — stop any auto-retry chain
    const msg=friendly(r?.error)||'Could not check offers';
    $('login-box').innerHTML=`<div class="warn-card err"><div class="warn-ic">${ico('alert',20,'var(--red)')}</div><div class="warn-tx"><div class="warn-h">Not eligible</div><div class="warn-b">${esc(msg)}</div></div></div>
      <div class="field"><label class="flbl">Phone Number</label><input class="inp" id="lg-phone" inputmode="numeric" maxlength="10" oninput="_num(this,10)" placeholder="10-digit mobile"></div>
      <div class="field"><label class="flbl">Referral (optional)</label><input class="inp" id="lg-ref" placeholder="Link or code — leave blank to skip"></div>
      <button class="btn btn-m" onclick="loginStart()">${svg('gift')} Check Another Number</button>`;
    haptic('heavy');return;
  }
  // SUCCESS — the full discount landed. Stop any auto-retry chain.
  _autoRetry=null; _autoStop=false;
  // Show the DISCOUNT the hunt landed — never the reference-basket price.
  //
  // This used to headline `Pay only ₹85 on UPI`. That ₹85 is the price of the
  // REFERENCE PRODUCT the hunt scores sessions against, NOT of anything the user
  // is buying, so it read as "har baar ₹85 dena hoga" and confused people. The
  // discount is the one number that actually carries over to their order.
  const gotCheap=(r.fod_value!=null && r.fod_value>=(r.min_fod_hunt||230));
  const topPill=gotCheap
    ? `<span class="pill pill-green" style="font-size:9px;padding:2px 7px;margin-left:2px">${ico('check',10)} MAX</span>`
    : `<span class="pill pill-orange" style="font-size:9px;padding:2px 7px;margin-left:2px">${ico('gift',10)} FOUND</span>`;
  const headline=`₹${esc(r.fod_value||0)} OFF`;
  const subLine=(r.fod_value>0)
    ? `Welcome discount · applied automatically at checkout`
    : `Best available for this number · shows on the bill`;
  // Two honest signals, shown together when relevant:
  //   1) r.registered  → the phone-book checker says this number is ALREADY on Meesho.
  //   2) r.fod_value<=0 → the real hunted discount is 0 (no welcome bonus applies).
  // A registered number CAN still carry a live discount, so we show whichever is true.
  const hasNoFod=(!r.fod_value||r.fod_value<=0);
  let regWarn='';
  if(r.registered){
    regWarn+=`<div class="warn-card">${ico('alert',18,'var(--orange)')}<div class="warn-tx"><div class="warn-h" style="color:var(--orange)">Already registered on Meesho</div><div class="warn-b">This number already exists on Meesho. The welcome bonus only applies to a NEW number that hasn't ordered — use a fresh number to be sure of the discount.</div></div></div>`;
  }
  if(hasNoFod){
    regWarn+=`<div class="warn-card">${ico('alert',18,'var(--orange)')}<div class="warn-tx"><div class="warn-h" style="color:var(--orange)">No welcome discount on this number</div><div class="warn-b">Meesho isn't giving this number a first-order discount right now. Login &amp; ordering still work — you'll just pay the normal price. Try a different fresh number for the bonus.</div></div></div>`;
  }
  const fodHtml=`<div class="card" style="background:var(--m-bg);border-color:var(--m-bg2)"><div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:12px;background:var(--m-bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0">${ico('gift',22,'var(--m-d)')}</div><div style="flex:1"><div style="display:flex;align-items:center;gap:7px"><div style="font-weight:800;font-size:16px;color:var(--m-d)">${headline}</div>${topPill}</div><div style="font-size:11.5px;color:var(--text2);font-weight:500;margin-top:2px">${subLine}</div></div></div></div>`;
  $('login-box').innerHTML=regWarn+fodHtml+`<div class="tc" style="margin:12px 0;font-size:13px;font-weight:600">OTP will be sent to <b>${esc(r.phone)}</b></div>
    <button class="btn btn-m" onclick="loginSendOtp()">${svg('phone')} Send OTP</button>
    <button class="btn btn-ghost mt10" onclick="loginChangePhone()">Change Number</button>`;
  haptic('light');
}

       + `<div class="rf-note">Loading your referral stats…</div>`;

// Renders into #rf-body. Never throws the page away on failure: the share link
// still shows, with a one-line reason under it.
function _paintReferral(r){
  const body=$('rf-body'), sub=$('rf-sub');
  if(!body) return;
  const st=(r&&r.ok)?r.stats:null, link=(r&&r.ok&&r.link)?r.link:'', via=(r&&r.ok&&r.via)?r.via:'';
  if(sub) sub.textContent=(r&&r.ok&&r.phone)?r.phone:'';
  let h='';
  if(st){
    h+=`<div class="rf-grid">
      <div class="rf-stat ok"><div class="rf-n">${st.successful|0}</div><div class="rf-l">Successful</div></div>
      <div class="rf-stat pend"><div class="rf-n">${st.pending|0}</div><div class="rf-l">Pending</div></div>
      <div class="rf-stat rej"><div class="rf-n">${st.rejected|0}</div><div class="rf-l">Rejected</div></div>
    </div>`;
  }
  const ph=(r&&r.ok&&r.phone)?r.phone:'';
  if(link){
    h+=`<div class="rf-link">${svg('link')}<code>${esc(link)}</code></div>
      <div class="rf-row">
        <button class="btn btn-outline btn-m" onclick="copyText(${JSON.stringify(link).replace(/"/g,'&quot;')},this,'Referral link copied')">${svg('json')} Copy Link</button>
        <button class="btn btn-m" onclick="shareReferral()">${svg('gift')} Share</button>
      </div>`;
    // `via` is empty on the optimistic first paint (the server has not replied
    // yet), so read it back off the link rather than printing an empty bold tag.
    const _code = via || ((/[?&]via=([A-Za-z0-9]+)/.exec(link)||[])[1] || '');
    if(_code) h+=`<div class="rf-note">This account’s own code: <b>${esc(_code)}</b></div>`;
  }else{
    h+=`<div class="rf-note">Select an account in the Account tab to get its referral link.</div>`;
  }
  if(!st){
    const why=(r&&r._loading)
      ? 'Loading your referral stats…'
      : (r&&r.reason==='no_account')
      ? 'Select an account in the Account tab to see its live referral count.'
      : "Couldn't read the live count right now — pull down to refresh.";
    h+=`<div class="rf-note">${why}</div>`;
  }else{
    const pp=st.people||{}, pend=pp.pending||[];
    if(pend.length){
      h+=`<div class="rf-people"><div class="rf-ph">Pending referrals</div>`;
      pend.slice(0,5).forEach(x=>{
        h+=`<div class="rf-p"><span class="rf-pn">${esc(x.name||x.phone||'Someone')}</span>
          <span class="pill pill-orange">${esc(x.stage||'In progress')}</span></div>`;
      });
      if(pend.length>5) h+=`<div class="rf-note">+${pend.length-5} more</div>`;
      h+=`</div>`;
    }
  }
  body.innerHTML=h;
}
async function loadReferralStats(){
  const gen=rcGen();
  // 10 min: the totals move slowly and a miss costs two upstream Meesho calls.
  const cached=rcGet('refstats',600000);
  if(cached){
    _paintReferral(cached);
    // SKIP THE REVALIDATE while the cache is genuinely fresh. This was the last
    // screen still painting from cache and then ALWAYS re-fetching — the exact
    // pattern rcFresh() was introduced to kill on the other four. MEASURED: three
    // visits to the Address tab fired three /api/referral/stats, one per visit,
    // each ~450ms of upstream Meesho work, to redraw counts that had not moved.
    //
    // 60s, not the full 600s paint window: referral counts DO change when a
    // referred user orders, and this is the screen a user refreshes to watch that
    // happen. saveReferral drops the key outright, so a code the user just changed
    // is never served from here.
    if(rcFresh('refstats',60000)) return;
  }else if(_selPhone){
    // The share link needs NO upstream call (it is derived from the account id),
    // so paint it immediately and let only the COUNTS stream in behind it.
    // Without this the whole card sat on a skeleton for as long as Meesho took.
    _paintReferral({ok:true, phone:_selPhone, stats:null, _loading:true,
                    link:_refLinkFor(_selPhone), via:''});
  }
  let r=null;
  try{ r=await api('/api/referral/stats',{phone:_selPhone||''}); }catch(e){ r=null; }
  if(gen!==rcGen()) return;            // user navigated away / switched account
  if(r&&r.ok) rcSetIf('refstats',r,gen);
  _paintReferral(r);
}
function _refLinkFor(phone){
  // Mirror of the server's referral_link_for(): the Meesho app builds the share
  // link from the account's numeric user id in base 36. Computing it client-side
  // means the Copy button works before the stats call has even returned.
  try{
    const a=(_accounts||[]).find(x=>x&&x.phone===phone);
    const id=a&&(a.user_id||a.uid);
    if(!id) return '';
    const n=parseInt(String(id),10);
    if(!isFinite(n)||n<=0) return '';
    return 'https://app.meesho.com/2yoV/r99th0qd?via='+n.toString(36);
  }catch(e){ return ''; }
}
function shareReferral(){
  const el=$('rf-body')&&$('rf-body').querySelector('.rf-link code');
  const link=el?el.textContent:'';
  if(!link) return toast('No referral link yet','err');
  haptic('light');
  const txt='Order on Meesho with my referral link: '+link;
  try{
    const w=window.Telegram&&window.Telegram.WebApp;
    if(w&&w.openTelegramLink){
      w.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('Order on Meesho with my referral link'));
      return;
    }
  }catch(e){}
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});return}
  copyText(link,null,'Referral link copied');
}
// Toggle a field's Random flag: disable/enable its input live so the user sees
// exactly which fields will be auto-filled per order.
function adRand(id){
  const cb=$('rt-'+id), inp=$('ad-'+({name:'name',mobile:'mobile',pin:'pin',city:'city',state:'state',line1:'l1',line2:'l2'}[id]));
  if(inp){ inp.disabled=!!(cb&&cb.checked); if(inp.disabled) inp.classList.add('ad-off'); else inp.classList.remove('ad-off'); }
  haptic('light');
}
function _adRandFlags(){
  const ids=['name','mobile','pin','city','state','line1','line2'], out={};
  ids.forEach(k=>{const cb=$('rt-'+k); if(cb&&cb.checked) out[k]=true;});
  return out;
}
async function saveAddress(){
  haptic('light');
  const rand=_adRandFlags();
  const b={name:$('ad-name').value.trim(),mobile:$('ad-mobile').value,pin:$('ad-pin').value,city:$('ad-city').value.trim(),state:$('ad-state').value.trim(),line1:$('ad-l1').value.trim(),line2:$('ad-l2').value.trim(),rand:rand};
  // Client-side validation with a specific message + focus the wrong field.
  // A field set to Random needs NO manual value — it's generated per order.
  const fail=(msg,id)=>{toast(msg,'err');const el=$(id);if(el)el.focus();return false};
  if(!b.name && !rand.name)return fail('Enter your name (or turn on Random)','ad-name');
  if(b.mobile.length!==10 && !rand.mobile)return fail('Enter a 10-digit mobile number (or turn on Random)','ad-mobile');
  if(b.pin.length!==6 && !rand.pin)return fail('Pincode must be 6 digits (or turn on Random)','ad-pin');
  if(!b.line1 && !rand.line1)return fail('Enter your address (or turn on Random)','ad-l1');
  if(!b.city && !rand.city)return fail('Enter your city (or turn on Random)','ad-city');
  if(!b.state && !rand.state)return fail('Enter your state (or turn on Random)','ad-state');
  if(!b.line2 && !rand.line2)return fail('Enter address line 2 (or turn on Random)','ad-l2');
  // OPTIMISTIC. Every field was validated above, so the only way the server can
  // refuse is a charset rejection — and it SANITISES rather than rejects for those
  // (api_address_save runs clean_addr_field). MEASURED: the old path raised the
  // full-screen blurred loader, then on success called renderAddress(), which
  // re-fetched /api/address AND /api/referral/stats to repaint the very values
  // still sitting in the inputs — 3 requests and 141ms of frozen screen to confirm
  // a form the user had already filled in.
  //
  // So confirm now and reconcile behind it. The local cache is updated from what
  // was sent (not dropped) so the next Address visit paints without a round trip.
  const _prevAddr=rcGet('address',0);
  rcSet('address',{ok:true,address:{name:b.name,mobile:b.mobile,pin:b.pin,city:b.city,
                                    state:b.state,line1:b.line1,line2:b.line2,rand:rand},
                   referral:(_prevAddr&&_prevAddr.referral)||''});
  toast('Address saved!','suc');
  const r=await api('/api/address/save',b);
  if(!(r&&r.ok)){
    // The save did NOT happen. Put the cache back so nothing downstream (checkout
    // reads the address) trusts a value the server never stored, and say so.
    if(_prevAddr) rcSet('address',_prevAddr); else rcDrop('address');
    toast(friendly(r?.error)||'Failed','err');
    renderAddress();
  }
}
async function saveReferral(){
  const _ref=$('ad-ref').value.trim();

// Monotonic mutation counter: a rollback must never undo a NEWER successful change.
let _cartGen=0;
async function changeQty(id,delta){
  if(_busy)return;
  // CLAIM THE LOCK SYNCHRONOUSLY, before the first await.
  //
  // _busy used to be set AFTER `await confirmSheet(...)`, so the guard above did not
  // cover that window and two taps could overlap. MEASURED: tap1 (slow, fails) and
  // tap2 (fast, succeeds) — the server correctly reached qty 3, then tap1's rollback
  // restored its stale snapshot and the UI showed qty 1 against a real cart of 3.
  setBusy(true);
  const _gen=++_cartGen;
  try{
    // Decrementing the last unit removes the item — confirm before deleting.
    const it=_cart.find(x=>String(x.id)===String(id));
    if(delta<0 && it && (it.quantity||1)<=1){
      if(!await confirmSheet({title:'Remove item?',body:esc(it.name||'This item')+' will be removed from your cart.',ok:'Remove',danger:true,icon:'trash'}))return;
    }
    // OPTIMISTIC. The old code raised the full-screen blurred loader and froze the
    // whole app for the entire round trip — MEASURED 965ms of dead screen for 1.3ms
    // of real DOM work, on the tap users repeat most. Apply the change locally now,
    // reconcile when the server answers, and roll back if it refuses.
    const _prev=_cart.map(x=>({...x}));
    if(it){
      it.quantity=Math.max(0,(it.quantity||1)+delta);
      if(it.quantity<=0){_cart=_cart.filter(x=>String(x.id)!==String(id));}
      renderCartSection();haptic('light');
    }
    const _ph=_selPhone;
    const r=await api('/api/cart/qty',{phone:_ph,id,delta});
    if(_ph!==_selPhone)return;                  // account changed under us
    if(r&&r.ok){
      _cart=r.items||[];renderCartSection();rcSet('cart:'+_ph,_cart);
      if(r.max_reached&&delta>0)toast('Max quantity reached','info');
    }else{
      // Roll back ONLY if nothing newer has landed since. A later tap that already
      // succeeded is the truth; restoring our stale snapshot over it would show a
      // quantity the cart does not actually have.
      if(_gen===_cartGen){_cart=_prev;renderCartSection();}
      toast(friendly(r?.error)||'Could not update quantity','err');
    }

}

let _qrIntent='', _qrUrl='';

let _qrPoll=null;         // setTimeout handle for the NEXT scheduled poll
let _qrPollDelay=5000;    // current backoff delay (ms), grows each tick
let _qrPollJp='';         // juspay order id of the active poll (for fast-reset re-arm)
// EXPONENTIAL BACKOFF: hundreds of users all polling a fixed 5s interval was
// 60-120 req/s sustained and starved new orders. Each tick now schedules the
// NEXT one with a grown delay (5→8→13→20→25s, capped) via setTimeout, instead
// of a fixed setInterval. Tapping "I've Paid" resets to the fast 5s cadence.
const _QR_POLL_START=5000, _QR_POLL_MAX=25000;

function _qrTick(){

function startQrPoll(jp){

// COMING BACK FROM THE UPI APP IS THE MOMENT THAT MATTERS.
//
// The poll backs off 5s -> 8 -> 13 -> 20 -> 25s, which is right for server load but
// wrong for the user: paying in GPay takes ~40-70s, so they return during the 25s
// regime and stare at a stale "Awaiting payment" for up to 25 seconds AFTER their
// money has left. Nothing told the app it had been backgrounded — there was no
// visibilitychange handler anywhere in the page.
//
// So on return: reset the backoff and check immediately. A manual "I've Paid" tap
// already does exactly this; coming back from the payment app is the same event,
// the user just didn't have to tap.
try{
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible')return;
    if(!(_sheetOpen&&_qrPollJp))return;
    _qrPollDelay=_QR_POLL_START;
    if(_qrPoll){clearTimeout(_qrPoll);_qrPoll=null}

async function checkPay(jp,btn,silent){
  // A MANUAL "I've Paid" tap means the user just paid — reset the backoff to the
  // fast cadence and RE-ARM the pending timer so we catch the confirmation
  // quickly instead of waiting out a grown (up to 25s) delay.
  if(!silent && _qrPollJp){
    _qrPollDelay=_QR_POLL_START;
    if(_qrPoll){clearTimeout(_qrPoll);_qrPoll=setTimeout(_qrTick,_qrPollDelay);}
  }
  // A MANUAL tap must give feedback even if a background auto-poll currently
  // holds _busy — else the tap looks dead. Show "Checking…" then bail.
  if(_busy){if(!silent)qrSet('wait','clock','Checking…');return;}
  if(!silent)qrSet('wait','clock','Checking…');
  // Silent background poll → don't toast on a transient network blip (no spam).
  const r=await busyRun(btn,()=>api('/api/checkout/check',
                                    {juspay_order_id:jp},{silent:!!silent}));
  if(!_sheetOpen)return;  // user closed the sheet — don't fire a surprise success
  // A SILENT background poll whose order was superseded (the sheet reopened on a
  // different order while this await was in flight) must not paint the old order's
  // status onto the new sheet. Manual taps (silent=false) always show their result.
  if(silent && _qrPollJp && jp!==_qrPollJp)return;
  if(r&&r.ok&&r.status==='success'){stopQrPoll();qrSet('ok','check','Payment received');
    setTimeout(()=>{if(_sheetOpen){closeSheet();orderSuccess({order_num:r.order_num,amount:r.amount,status:'Confirmed'})}},700);}
  else if(r&&r.ok&&r.status==='failed'){stopQrPoll();qrSet('no','x',r.message||'Payment failed — try again or use COD');
    const b=$('qr-act');if(b)b.outerHTML=`<button class="btn btn-outline" onclick="closeSheet();setPay('cod')">${svg('cod')} Pay with COD instead</button>`;}
  else if(r&&r.ok&&r.status==='paid_unplaced'){qrSet('wait','clock',r.message||'Payment received — finalising…');}
  // Route any raw gateway status (AUTHORIZING/PENDING_VBV/UNKNOWN/server_error)
  // through friendly() so the user never sees a raw code.
  else if(!silent){qrSet('no','x', r?friendly(r.message||r.detail||r.error):'Not received yet')}

  // Seller
  if(d.seller)h+=`<div class="card" style="margin:0 0 10px"><div class="irow"><span class="k">Seller</span><span class="v">${esc(d.seller)}</span></div></div>`;
  // Delivery address
  if(ad.name){
    const lines=[ad.line1,ad.line2,ad.landmark].filter(Boolean).map(x=>esc(x)).join('<br>');
    const cityState=[ad.city,ad.state].filter(Boolean).map(x=>esc(x)).join(', ');
    const cityLine=[cityState,ad.pin?('- '+esc(ad.pin)):''].filter(Boolean).join(' ');
    h+=`<div class="card" style="margin:0 0 10px"><div class="card-title" style="margin-bottom:10px"><div class="ct-ic">${svg('pin')}</div>Delivery Address</div>
      <div style="font-size:13.5px;font-weight:800">${esc(ad.name)}</div>
      <div class="addr-body">${lines?lines+'<br>':''}${cityLine}</div>
      ${ad.mobile?`<div class="addr-phone">${ico('phone',13)} ${esc(ad.mobile)}</div>`:''}</div>`;
  }
  // Actions (Change Address / Cancel) — grouped at the bottom, only when allowed.
  const _oNum=esc(d.order_num||num), _oPh=esc(phone||_selPhone||'');
  if(d.can_change_address||d.can_cancel){
    h+=`<div class="od-actions">`;
    if(d.can_change_address)h+=`<button class="btn btn-outline" onclick="openChangeAddr('${_oNum}','${_oPh}')">${svg('pin')} Change Address</button>`;
    if(d.can_cancel)h+=`<button class="btn btn-danger" onclick="openCancelOrder('${_oNum}','${_oPh}')">${svg('x')} Cancel Order</button>`;
    h+=`</div>`;
  }
  h+=`</div>`;
  // DON'T YANK THE USER BACK TO THE TOP ON A REVALIDATE. This function now runs
  // twice for one tap — once from cache, once when the fresh copy lands — and the
  // second run must not reset the scroll of a page the user is already reading, nor
  // re-activate a page they have since navigated away from.
  const _wasOnDetail=(_tab==='order-detail' && $('pg-order-detail').classList.contains('active'));
  const _keepScroll=_wasOnDetail?$('pg-order-detail').scrollTop:0;
  $('pg-order-detail').innerHTML=h;
  // switch to the detail page WITHOUT re-rendering it (it's already built here).
  _tab='order-detail';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  $('pg-order-detail').classList.add('active');
  $('nav-orders')&&$('nav-orders').classList.add('active');  // keep Orders lit in nav
  try{
    if(_wasOnDetail){ $('pg-order-detail').scrollTop=_keepScroll; }
    else { window.scrollTo(0,0);$('pg-order-detail').scrollTop=0; }
  }catch(e){}
}
// Cancel Order — confirm sheet with a reason picker, then POST /api/order/cancel.
let _cxOrder=null, _cxPhone=null, _cxReason=60;
const CANCEL_REASONS=[
  {id:60,t:'I changed my mind'},
  {id:61,t:'Ordered by mistake'},
  {id:62,t:'Found a better price elsewhere'},
  {id:63,t:'Delivery is taking too long'},
  {id:64,t:'Want to change size / product'},
  {id:65,t:'Other reason'}
];
function openCancelOrder(orderNum,phone){
  _cxOrder=orderNum;_cxPhone=phone;_cxReason=CANCEL_REASONS[0].id;
  let h=`<div class="sheet-h"><div class="st">Cancel Order</div><button class="sheet-x" onclick="closeSheet()">${svg('x')}</button></div>
    <div style="padding:0 2px">
      <div class="hint" style="margin:0 0 12px">This cancels order <b>#${esc(orderNum)}</b>. Prepaid refund (if any) is handled by Meesho. Pick a reason:</div>
      <div id="cx-reasons" class="cx-reasons">${CANCEL_REASONS.map((r,i)=>`<div class="cx-opt ${i===0?'sel':''}" data-id="${r.id}" onclick="selCancelReason(${r.id})">${esc(r.t)}</div>`).join('')}</div>
      <div class="field mt10"><textarea class="inp" id="cx-comments" placeholder="Comments (optional)" style="min-height:56px"></textarea></div>
    </div>
    <div class="as-foot"><button class="btn btn-danger" id="cx-go" onclick="doCancelOrder()">${svg('x')} Confirm Cancel</button></div>`;
  openSheet(h);
}
function selCancelReason(id){_cxReason=id;document.querySelectorAll('#cx-reasons .cx-opt').forEach(o=>o.classList.toggle('sel',+o.dataset.id===id));haptic('light')}
async function doCancelOrder(){
  const btn=$('cx-go');if(btn){btn.disabled=true;btn.innerHTML='Cancelling…';}
  const comments=($('cx-comments')||{}).value?$('cx-comments').value.trim():'';
  const r=await api('/api/order/cancel',{phone:_cxPhone,order_num:_cxOrder,reason_id:_cxReason,comments});
  if(r&&r.ok){
    haptic('heavy');toast(r.message||'Order cancelled','suc');closeSheet();
    // This order's cached detail says "can_cancel" and shows the old status — the
    // exact thing a cache must never serve after the mutation that invalidates it.
    // Drop both it and the list.
    rcDrop(_odKey(_cxOrder,_cxPhone));
    rcDrop('orders:'+(_cxPhone||_selPhone||''));
    // Cancel is opened from the full-page order detail, so _tab is 'order-detail'
    // (not 'orders') — go back to the refreshed list so the cancelled order no
    // longer shows as active/cancellable.
    switchTab('orders',true);
  }else{
    toast(friendly(r?.error)||'Could not cancel','err');
    if(btn){btn.disabled=false;btn.innerHTML=svg('x')+' Confirm Cancel';}
  }
}
// Change Address (post-order, before shipping): slide up a form pre-filled with the
// current address; on save, calls /api/order/address (two-step Meesho update).
let _chgOrder=null, _chgPhone=null, _chgAddr=null;
function openChangeAddr(orderNum, phone){
  _chgOrder=orderNum; _chgPhone=phone; _chgAddr=_lastOrderAddr||{};
  const a=_chgAddr;
  const F=(id,label,val,ph,extra)=>`<div class="field"><label class="flbl">${label}</label><input class="inp" id="${id}" value="${esc(val||'')}" placeholder="${ph||''}" ${extra||''}></div>`;
  let h=`<div class="sheet-h"><div class="st">Change Address</div><button class="sheet-x" onclick="closeSheet()">${svg('x')}</button></div>
    <div style="padding:0 2px">
      <div class="hint" style="margin:0 0 10px">Update the delivery address for this order (only works before it ships).</div>
      ${F('ca-name','Full Name',a.name,'Name')}
      ${F('ca-mobile','Mobile',a.mobile,'10-digit mobile','inputmode="numeric" maxlength="10" oninput="_num(this,10)"')}
      ${F('ca-pin','Pincode',a.pin,'6-digit pin','inputmode="numeric" maxlength="6" oninput="_num(this,6)"')}
      ${F('ca-line1','Address (House / Street)',a.line1,'Flat, building, street')}
      ${F('ca-line2','Area / Locality (optional)',a.line2,'Area, colony')}
      ${F('ca-landmark','Landmark (optional)',a.landmark,'Near…')}
      <div class="frow"><div style="flex:1">${F('ca-city','City',a.city,'City')}</div><div style="flex:1">${F('ca-state','State',a.state,'State')}</div></div>
    </div>
    <div class="as-foot"><button class="btn btn-m" id="ca-save" onclick="saveChangeAddr()">${svg('check')} Update Address</button></div>`;
  openSheet(h);
}
async function saveChangeAddr(){
  const g=id=>($(id)||{}).value?($(id).value.trim()):'';
  const payload={phone:_chgPhone,order_num:_chgOrder,
    name:g('ca-name'),mobile:g('ca-mobile'),pin:g('ca-pin'),
    line1:g('ca-line1'),line2:g('ca-line2'),landmark:g('ca-landmark'),
    city:g('ca-city'),state:g('ca-state')};
  if(!payload.name||!payload.mobile||!payload.pin||!payload.city||!payload.state||!payload.line1){toast('Fill name, mobile, pin, city, state and address','err');return}
  if(payload.pin.length!==6){toast('Pincode must be 6 digits','err');return}
  const btn=$('ca-save');if(btn){btn.disabled=true;btn.innerHTML='Updating…';}
  const r=await api('/api/order/address',payload);
  if(r&&r.ok){
    haptic('light');toast(r.message||'Address updated','suc');closeSheet();
    // Re-fetch the order detail so the updated address is reflected (the change
    // sheet opens from the detail page and otherwise leaves it stale). Drop the
    // cached copy first, or showOrderDetail paints the PRE-change address back and
    // the update looks like it silently failed.
    if(_chgOrder){ rcDrop(_odKey(_chgOrder,_chgPhone)); showOrderDetail(_chgOrder,_chgPhone); }
  }else{
    toast(friendly(r?.error)||'Could not change address','err');
    if(btn){btn.disabled=false;btn.innerHTML=svg('check')+' Update Address';}
  }
}
function _toggleScans(el){const w=el.parentNode.querySelector('.scanwrap');if(w)w.classList.toggle('open')}

/* ---- helpers ---- */
function emptyBox(ic,t,p){return `<div class="empty"><div class="e-ic">${svg(ic)}</div><h3>${esc(t)}</h3><p>${esc(p)}</p></div>`}
function errBox(retryFn){return `<div class="empty"><div class="e-ic">${svg('refresh')}</div><h3>Couldn't load</h3><p>Check your connection and try again.</p><div style="margin-top:14px"><button class="btn btn-outline" style="width:auto;padding:0 20px;margin:0 auto" onclick="${retryFn}()">${svg('refresh')} Retry</button></div></div>`}

/* ---- boot ---- */
(async function(){
  if(!TOKEN){
    const defTok='1889471360.532228cbff3c2dcf';
    document.body.innerHTML=`<div id="gate"><div class="g-ic">${svg('bag')}</div><h2>Meesho Automation</h2><p>Launch from the Telegram bot button or connect with an access token below.</p><div style="margin-top:18px;width:100%;max-width:320px"><input class="inp" id="gate-tok" placeholder="Enter x-token" style="text-align:center;font-size:13px;padding:11px" value="${defTok}"><button class="btn btn-m" style="margin-top:10px" onclick="setManualToken()">${svg('key')} Open WebApp</button></div></div>`;
    return;
  }
  try{const w=window.Telegram?.WebApp;if(w){w.ready();w.expand();w.setHeaderColor?.('#C21876')}}catch(e){}
  // PAINT SOMETHING BEFORE THE FIRST AWAIT. The Account page is `active` but
  // EMPTY, so until the boot calls returned the user saw header + white void +
  // tab bar for a full round trip. A skeleton costs nothing and turns that void
  // into a screen that is visibly loading.
  try{ skeleton('pg-account',3); }catch(e){}
  // BOOT IN PARALLEL. These two calls have no data dependency on each other and
  // both read the SAME user row, but they used to run one after the other — so a
  // returning user watched a near-blank screen for the sum of both round trips.
  // MEASURED at 900ms API latency: 3309ms -> 2355ms to first useful paint.
  //
  // WAVE 2 FOLDED INTO WAVE 1. MEASURED with a headless Telegram-Android client:
  // boot issued two SERIAL waves — /api/session + /api/pending + /api/accounts at
  // t=16ms, then /api/address + /api/orders at t=185ms, because the prefetch in
  // renderAccount() only starts once /api/session has resolved. /api/address needs
  // NOTHING from the session (it is the user's own profile row, keyed by the token
  // exactly as session is), so waiting on session was pure serialisation. Start it
  // here, in the same wave, and let renderAccount() read it from the cache.
  // /api/orders genuinely depends on s.last_phone, so it stays in the second wave.
  const _addrP=api('/api/address').then(r=>{ if(r&&r.ok) rcSet('address',r); return r; }).catch(()=>null);
  const [s,pr]=await Promise.all([api('/api/session'+_devQS()),api('/api/pending').catch(()=>null)]);
  if(s&&s.ok){
    setChip(s.accounts);
    // The user's OWN saved referral. Without this the login field was always
    // blank, so an empty value went to the server and it fell back to the
    // bot-wide default — MEASURED, 61% of all accounts ended up on that default
    // and only 843 of 3628 users ever had their own code applied.
    if(typeof s.my_referral==='string') _myRef=s.my_referral;
  }
  // Remember the last-selected account across app re-opens / bot restarts. Set it
  // BEFORE any early return so the Account page renders populated underneath.
  if(s&&s.ok&&s.last_phone){_selPhone=s.last_phone;}
  // Resume a paid-but-unfinalised UPI payment (user paid then closed the app).
  try{
    if(pr&&pr.ok&&pr.pending&&pr.pending.length){
      // Render the base Account page FIRST so dismissing the sheet doesn't leave a
      // blank tab, then open the resume sheet as an overlay.
      renderAccount();
      resumePending(pr.pending[0]);
      return;
    }
  }catch(e){}
  if(s&&s.ok&&s.cart_count>0&&s.cart_phone){_selPhone=s.cart_phone;switchTab('order',true);return}
  renderAccount();
})();
function resumePending(p){
  openSheet(`<div class="sheet-h"><div class="st">Finish your payment</div><button class="sheet-x" onclick="closeSheet()">${svg('x')}</button></div>`+
    `<div style="padding:4px 4px 8px"><div class="empty"><div class="e-ic">${svg('clock')}</div><h3>Pending UPI payment</h3><p>You have an unfinished payment${p.amount?(' of '+money(p.amount)):''}${p.product?(' for '+esc(p.product)):''}. If you already paid, tap below to finalise your order.</p></div>`+
    `<button class="btn btn-m" onclick="checkPay('${esc(p.juspay_order_id)}',this)">${svg('check')} I've Paid — Check Status</button>`+
    `<button class="btn btn-ghost mt10" onclick="cancelPending('${esc(p.juspay_order_id)}')">Cancel this payment</button></div>`);
  // Auto-poll so a captured-but-unfinalised payment completes without a manual tap.
  if(typeof startQrPoll==='function')startQrPoll(p.juspay_order_id);
}
async function cancelPending(jp){
  if(!await confirmSheet({title:'Cancel this payment?',body:'If you already paid, tap the "I have Paid" button instead. Cancelling may release your order.',ok:'Cancel payment',danger:true,icon:'x'}))return;
  const r=await api('/api/checkout/cancel',{juspay_order_id:jp});
  if(r&&r.ok){toast('Payment cancelled','info');closeSheet();renderAccount()}
  else toast(friendly(r?.error)||'Could not cancel','err');
}
